window.TPL={"html": "<div id=\"deck\">\n\n<!-- ============ OUVERTURE ============ -->\n<section class=\"slide dark cover\" data-keep=\"1\" data-title=\"Couverture\" data-ch=\"Ouverture\">\n  <div class=\"in\">\n    <h1>Veille professionnelle : le cas Decathlon<\/h1>\n    <p class=\"sub\">Chercher, trier, analyser avec l’IA, puis écrire une note de veille<\/p>\n    <p class=\"cred\">Licence · ISO Nantes · Pierrick Briand<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"slide\" data-keep=\"1\" id=\"intro-atelier\" data-title=\"Votre travail\" data-ch=\"Ouverture\">\n  <div class=\"in\">\n    <h2>Votre travail<\/h2>\n    <p class=\"lead\">Un dossier individuel. Vos réponses restent dans ce navigateur.<\/p>\n    <div class=\"grpcard\">\n      <div><span class=\"lab\">Cas étudié<\/span><b>Decathlon<\/b><\/div>\n      <div><span class=\"lab\">Étudiant<\/span><b data-grp=\"membres\"><\/b><\/div>\n      <button class=\"btn sec\" type=\"button\" data-chg=\"1\">Modifier le nom<\/button>\n    <\/div>\n    <p class=\"small\"><strong>En fin de cours, enregistrez votre travail.<\/strong> Le fichier .json en garde une copie : vous pourrez le rouvrir sur un autre appareil.<\/p>\n    <div class=\"actions\">\n      <button class=\"btn\" type=\"button\" data-send=\"1\" hidden>Envoyer à l’enseignant<\/button>\n      <button class=\"btn\" type=\"button\" data-save=\"1\">Sauvegarder ou importer<\/button>\n      <button class=\"btn sec\" type=\"button\" id=\"btnDemo\">Enseignant : remplir avec un exemple<\/button>\n      <span class=\"msg\" id=\"resetMsg\" aria-live=\"polite\"><\/span>\n    <\/div>\n    <p class=\"small\">Les activités du dossier : cliquez pour y aller.<\/p>\n    <div class=\"cols\" id=\"parcours\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"slide\" data-keep=\"1\" data-title=\"Un cours, quatre parties\" data-ch=\"Ouverture\">\n  <div class=\"in\">\n    <h2>Quatre heures, quatre parties, un dossier<\/h2>\n    <p class=\"lead\">Vous repérez un signal faible ou une tendance stratégique chez Decathlon, et vous le prouvez par des sources.<\/p>\n    <div class=\"cols\">\n      <div class=\"col\"><span class=\"no\">Partie 1 · 45 min<\/span><h3>Cadrer<\/h3><p class=\"muted\">La veille, ses quatre axes, son utilité pour chaque service.<\/p><\/div>\n      <div class=\"col\"><span class=\"no\">Partie 2 · 45 min<\/span><h3>S’outiller<\/h3><p class=\"muted\">Les opérateurs de recherche, l’IA comme assistant d’analyse.<\/p><\/div>\n      <div class=\"col cur\"><span class=\"no\">Partie 3 · 2 h<\/span><h3>Produire<\/h3><p class=\"muted\">Collecte, traitement par l’IA, rédaction du dossier.<\/p><\/div>\n      <div class=\"col\"><span class=\"no\">Partie 4 · 30 min<\/span><h3>Déposer<\/h3><p class=\"muted\">Tour de table et dépôt du dossier.<\/p><\/div>\n    <\/div>\n    <p class=\"small\">À la fin du cours, vous savez utiliser les opérateurs, rédiger une consigne pour l’IA et écrire une synthèse sourcée.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"slide\" data-keep=\"1\" data-title=\"Comment vous êtes évalués\" data-ch=\"Ouverture\">\n  <div class=\"in\">\n    <h2>Comment vous êtes évalués<\/h2>\n    <p class=\"lead\">Un dossier individuel de 3 à 4 pages, noté sur 20.<\/p>\n    <div class=\"rows\">\n      <div class=\"row\"><span class=\"k\">Recherche · 5 points<\/span><span>Requêtes booléennes correctes, filtres pertinents, méthode retracée.<\/span><\/div>\n      <div class=\"row\"><span class=\"k\">Sources · 5 points<\/span><span>Récentes, variées, fiables ; contenus publicitaires écartés.<\/span><\/div>\n      <div class=\"row\"><span class=\"k\">IA · 5 points<\/span><span>Consigne fournie en annexe, rôle et objectif clairs, erreurs corrigées.<\/span><\/div>\n      <div class=\"row\"><span class=\"k\">Rédaction · 5 points<\/span><span>3 à 4 pages, signal faible clair, mise en page professionnelle.<\/span><\/div>\n    <\/div>\n    <p class=\"small\">Le dossier doit contenir vos mots-clés, vos sources exactes et votre consigne de base. Les activités ne rapportent pas de points : le cours affiche votre avancement.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"slide\" data-keep=\"1\" data-title=\"Votre journal de bord\" data-ch=\"Ouverture\">\n  <div class=\"in\">\n    <h2>Votre journal de bord : la trace de votre travail<\/h2>\n    <p class=\"lead\">Il nourrit le tour de table de la partie 4.<\/p>\n    <div class=\"rows\">\n      <div class=\"row\"><span class=\"k\">Quoi consigner<\/span><span>Une requête qui a marché, une source écartée, une erreur de l’IA, une question.<\/span><\/div>\n      <div class=\"row\"><span class=\"k\">Quand<\/span><span>En une à trois phrases, avec le bouton « Journal » en bas de l’écran.<\/span><\/div>\n      <div class=\"row\"><span class=\"k\">Combien<\/span><span>Trois entrées au moins pendant l’atelier, dont une erreur de l’IA.<\/span><\/div>\n    <\/div>\n    <div class=\"actions\"><button class=\"btn\" type=\"button\" id=\"btnJ1\">Ouvrir mon journal<\/button><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Ouverture de la partie 1\" class=\"slide dark opener\" data-title=\"Partie 1\" data-ch=\"Partie 1 · Cadrage\">\n  <div class=\"in\"><h1>Partie 1 : cadrage et concepts de base<\/h1><\/div>\n<\/section>\n\n<section data-sec=\"Ouverture de la partie 1\" class=\"slide\" data-title=\"Le déroulé des quatre heures\" data-ch=\"Partie 1 · Cadrage\">\n  <div class=\"in\">\n    <h2>Le déroulé des quatre heures<\/h2><div class=\"rows\"><div class=\"row\"><span class=\"k\">13&nbsp;h&nbsp;30 – 14&nbsp;h&nbsp;15<\/span><span>Partie 1 · Cadrage : la veille, ses quatre axes, son utilité. Échange avec la salle.<\/span><\/div><div class=\"row\"><span class=\"k\">14&nbsp;h&nbsp;15 – 15&nbsp;h&nbsp;00<\/span><span>Partie 2 · Les outils : opérateurs de recherche, IA, échauffement.<\/span><\/div><div class=\"row\"><span class=\"k\">15&nbsp;h&nbsp;00 – 17&nbsp;h&nbsp;00<\/span><span>Partie 3 · L’atelier : collecte, traitement, rédaction du dossier.<\/span><\/div><div class=\"row\"><span class=\"k\">17&nbsp;h&nbsp;00 – 17&nbsp;h&nbsp;30<\/span><span>Partie 4 · Clôture : tour de table et dépôt du dossier.<\/span><\/div><\/div><p class=\"small\">La moitié du temps se passe à manipuler les outils.<\/p>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Test de positionnement\" class=\"slide\" data-title=\"Test de positionnement · début\" data-ch=\"Partie 1 · Cadrage\">\n  <div class=\"in\">\n    <h2>Test de positionnement : où en êtes-vous ?<\/h2><p class=\"lead\">Dix questions, cinq minutes, sans aide. Vous referez le même test en fin de module : l&#x27;écart mesure votre progression.<\/p><div class=\"pos\" data-pos=\"0\"><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Le cours\" class=\"slide\" data-keep=\"1\" data-title=\"Le cours · partie 1\" data-ch=\"Partie 1 · Cadrage\">\n  <div class=\"in\">\n    <h2>Le cours · partie 1 : la veille professionnelle<\/h2><div class=\"iter cours\"><div class=\"itabs\" role=\"group\" aria-label=\"Écrans du cours\"><button type=\"button\" data-i=\"0\" aria-pressed=\"true\">1 · La veille<\/button><button type=\"button\" data-i=\"1\" aria-pressed=\"false\">2 · Les quatre axes<\/button><button type=\"button\" data-i=\"2\" aria-pressed=\"false\">3 · À qui sert la veille ?<\/button><button type=\"button\" data-i=\"3\" aria-pressed=\"false\">4 · Signal faible ou tendance ?<\/button><button type=\"button\" data-i=\"4\" aria-pressed=\"false\">5 · Ce qu'une marque montre<\/button><button type=\"button\" data-i=\"5\" aria-pressed=\"false\">6 · À retenir<\/button><\/div><div class=\"istep cpan\" data-i=\"0\"><ol class=\"fil\" aria-label=\"Fil rouge du cours\"><li class=\"cur\" aria-current=\"step\"><b>Cadrage<\/b><small>partie 1<\/small><\/li><li class=\"\"><b>Outils<\/b><small>partie 2<\/small><\/li><li class=\"\"><b>Collecte<\/b><small>partie 3<\/small><\/li><li class=\"\"><b>Traitement<\/b><small>partie 3<\/small><\/li><li class=\"\"><b>Rédaction<\/b><small>partie 3<\/small><\/li><li class=\"\"><b>Dépôt<\/b><small>partie 4<\/small><\/li><\/ol><div class=\"cdef\"><b>Veille :<\/b> surveiller son environnement pour <b>décider plus tôt<\/b> et mieux.<\/div><p>On <b>collecte<\/b> l’information, on la <b>trie<\/b>, on l’<b>analyse<\/b>, puis on la <b>transmet<\/b> à celui qui décide.<\/p><p>Sans décision au bout, ce n’est pas de la veille : c’est de la lecture.<\/p><div class=\"cex\"><span class=\"lab\">Exemple · Decathlon<\/span><p>Decathlon publie chaque année ses résultats. Un concurrent les lit pour ajuster ses prix et ses ouvertures de magasins.<\/p><\/div><\/div><div class=\"istep cpan\" data-i=\"1\" hidden><div class=\"ctb\"><table class=\"tbl\"><thead><tr><th>Axe<\/th><th>Ce qu’on surveille<\/th><th>Exemple pour Decathlon<\/th><\/tr><\/thead><tbody><tr><td><b>Concurrentielle<\/b><\/td><td>Les concurrents : offres, prix, magasins, résultats<\/td><td>Les résultats d’Intersport, son principal concurrent en France<\/td><\/tr><tr><td><b>Technologique<\/b><\/td><td>Les innovations, les procédés, les brevets<\/td><td>La réparation, les matériaux recyclés, la logistique<\/td><\/tr><tr><td><b>Légale<\/b><\/td><td>Les lois, les normes, les décisions de justice<\/td><td>Les règles sur la réparation et l’affichage environnemental<\/td><\/tr><tr><td><b>Sociétale<\/b><\/td><td>Les usages, les valeurs, les attentes<\/td><td>L’achat d’occasion, la location plutôt que l’achat<\/td><\/tr><\/tbody><\/table><\/div><p>Une même information peut toucher deux axes. Dites lequel vous retenez, et pourquoi.<\/p><\/div><div class=\"istep cpan\" data-i=\"2\" hidden><div class=\"ctb\"><table class=\"tbl\"><thead><tr><th>Service<\/th><th>Sa question<\/th><th>Ce que la veille lui apporte<\/th><\/tr><\/thead><tbody><tr><td><b>Direction<\/b><\/td><td>Où investir dans trois ans ?<\/td><td>Les tendances, les rachats, les nouveaux marchés<\/td><\/tr><tr><td><b>Marketing<\/b><\/td><td>Que proposer, à quel prix, à qui ?<\/td><td>Les offres et les prix des concurrents, les attentes des clients<\/td><\/tr><tr><td><b>Achats<\/b><\/td><td>À qui acheter, à quel coût ?<\/td><td>Les fournisseurs, le prix des matières, les risques d’approvisionnement<\/td><\/tr><\/tbody><\/table><\/div><p>La même source ne sert pas tout le monde. Une bonne veille part de <b>la question du service<\/b>.<\/p><\/div><div class=\"istep cpan\" data-i=\"3\" hidden><div class=\"cdef\"><b>Signal faible :<\/b> une information <b>rare<\/b>, <b>précoce<\/b> et encore <b>ambiguë<\/b>. Elle peut annoncer un changement.<\/div><div class=\"cdef\"><b>Tendance :<\/b> un mouvement <b>déjà installé<\/b>, chiffré, connu de tous.<\/div><div class=\"cex\"><span class=\"lab\">Exemple · Decathlon<\/span><ul class=\"cli\"><li>Tendance : en 2025, Decathlon a vendu près de 1,6 million de produits de seconde main, avec une offre présente dans 43 pays ;<\/li><li>signal faible possible : dans le même communiqué, Decathlon annonce l’acquisition de 65 % de Bikeleasing Group, spécialiste de la location de vélos d’entreprise. Est-ce le début d’un passage de la vente à la location ?<\/li><\/ul><p>Le signal faible pose une question. À vous de chercher les faits qui la confirment ou la contredisent.<\/p><\/div><\/div><div class=\"istep cpan\" data-i=\"4\" hidden><p>Une entreprise <b>valorise<\/b> ce qui la sert : la croissance, les engagements, les innovations.<\/p><p>Elle reste <b>discrète<\/b> sur le reste : les marges, les fournisseurs, les difficultés.<\/p><div class=\"cex\"><span class=\"lab\">Exemple · Decathlon<\/span><p>Le communiqué de Decathlon met en avant 16,8 milliards d’euros de chiffre d’affaires et 1 746 ateliers de réparation.<\/p><p>C’est une source officielle, mais écrite pour valoriser. Elle se <b>recoupe<\/b> avec la presse économique et les données publiques.<\/p><\/div><\/div><div class=\"istep cpan\" data-i=\"5\" hidden><ul class=\"cli\"><li>La veille sert une décision ;<\/li><li>quatre axes : concurrentiel, technologique, légal, sociétal ;<\/li><li>chaque service a sa question ;<\/li><li>un signal faible est rare, précoce, ambigu ;<\/li><li>une source officielle se recoupe.<\/li><\/ul><details class=\"cq\"><summary>Je vérifie : la hausse des ventes d’occasion connue de tous, c’est un signal faible ?<\/summary><p>Non. C’est une tendance installée et chiffrée. Le signal faible est rare et encore ambigu.<\/p><\/details><details class=\"cq\"><summary>Je vérifie : une nouvelle loi sur la réparation relève de quel axe ?<\/summary><p>De la veille légale. Elle peut aussi toucher la veille sociétale : précisez l’angle.<\/p><\/details><div class=\"actions\"><button class=\"btn\" type=\"button\" data-goto=\"1.1 · Montrer ou cacher\">Commencer l’activité 1.1<\/button><\/div><\/div><\/div><p class=\"small csrc\"><a class=\"fdl\" href=\"https://pierrickbriand.github.io/veille-professionnelle-l3/fiches-cours-veille-professionnelle-l3.pdf\" target=\"_blank\" rel=\"noopener\" download>Télécharger les fiches de cours (PDF)<\/a> · Sources Decathlon : communiqué de presse « Résultats annuels 2025 », Decathlon, 2 avril 2026 (decathlon-united.media) ; Intersport : dépêche AFP reprise par FashionUnited, 9 avril 2026. Consultés le 20 octobre 2026.<\/p>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Activités\" class=\"slide\" data-title=\"1.1 · Montrer ou cacher\" data-ch=\"Partie 1 · Cadrage\" data-ex=\"1.1\" data-min=\"10\" data-s=\"1\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 1 · activité 1.1<\/p><h2>Ce que Decathlon valorise, ce qu’elle laisse dans l’ombre<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Notez une information que Decathlon met en avant, et une qu’elle garde discrète selon vous.<\/p><p>Dites où vous chercheriez la seconde. Vous partagerez vos idées avec la salle.<\/p><p class=\"small\"><b>À remplir ici<\/b> : une information valorisée, une information discrète, puis l’endroit où vous la chercheriez.<\/p><\/div><div class=\"exf\"><div class=\"fld\"><label for=\"f-mc_val\">Une information que Decathlon valorise<\/label><textarea data-k=\"mc_val\" rows=\"2\" placeholder=\"Ex. ses résultats annuels, ses ateliers de réparation\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-mc_cache\">Une information qu’elle garde discrète, selon vous<\/label><textarea data-k=\"mc_cache\" rows=\"2\" placeholder=\"Ex. ses marges, ses fournisseurs, ses difficultés\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-mc_ou\">Où chercher cette information discrète ?<\/label><input type=\"text\" data-k=\"mc_ou\" placeholder=\"Presse économique, comptes publiés, concurrents\"><\/div><div class=\"fld\"><label for=\"f-mc_axe\">L’axe de veille qui la concerne<\/label><select data-k=\"mc_axe\"><option value=\"\">Choisir…<\/option><option>Concurrentielle<\/option><option>Technologique<\/option><option>Légale<\/option><option>Sociétale<\/option><\/select><\/div><p class=\"msg\" id=\"msg-1_1\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Activités\" class=\"slide\" data-title=\"1.2 · Quiz · quel axe de veille ?\" data-ch=\"Partie 1 · Cadrage\" data-ex=\"1.2\" data-min=\"5\" data-s=\"1\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 1 · activité 1.2<\/p><h2>Quel axe de veille surveille cette information ?<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Une seule bonne réponse par question.<\/p><p>Lisez l’explication avant de passer à la suivante.<\/p><p class=\"small\"><b>À remplir ici<\/b> : quatre réponses en cliquant. Votre score s’affiche.<\/p><\/div><div class=\"exf\"><div class=\"quizg\" data-quiz=\"1.2\"><div class=\"pq qz\" data-i=\"0\"><p><b>1.<\/b> Intersport annonce l’ouverture de magasins en Espagne.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">Concurrentielle<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">Technologique<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">Légale<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">Sociétale<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"pq qz\" data-i=\"1\"><p><b>2.<\/b> Un nouveau procédé recycle les semelles de chaussures de sport.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">Concurrentielle<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">Technologique<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">Légale<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">Sociétale<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"pq qz\" data-i=\"2\"><p><b>3.<\/b> Une loi impose d’afficher l’impact environnemental des vêtements.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">Concurrentielle<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">Technologique<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">Légale<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">Sociétale<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"pq qz\" data-i=\"3\"><p><b>4.<\/b> De plus en plus de familles louent le matériel de ski au lieu de l’acheter.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">Concurrentielle<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">Technologique<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">Légale<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">Sociétale<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><\/div><p class=\"lead\" id=\"qzs-1_2\"><\/p><p class=\"msg\" id=\"msg-1_2\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Activités\" class=\"slide\" data-title=\"1.3 · Signal faible ou tendance ?\" data-ch=\"Partie 1 · Cadrage\" data-ex=\"1.3\" data-min=\"5\" data-s=\"1\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 1 · activité 1.3<\/p><h2>Signal faible ou tendance installée ?<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Classez chaque information.<\/p><p>Un signal faible pose une question ; une tendance est déjà une réponse.<\/p><p class=\"small\"><b>À remplir ici<\/b> : six réponses en cliquant. Votre score s’affiche.<\/p><\/div><div class=\"exf\"><div class=\"blind\" data-blind=\"1.3\"><div class=\"bt\" data-i=\"0\"><p class=\"bq\">Une enseigne de sport teste la location de tentes dans trois magasins.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Signal faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Tendance installée<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"1\"><p class=\"bq\">Les ventes en ligne pèsent une part croissante du commerce du sport depuis dix ans.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Signal faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Tendance installée<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"2\"><p class=\"bq\">Un concurrent dépose un brevet sur une chaussure réparable, sans annonce publique.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Signal faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Tendance installée<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"3\"><p class=\"bq\">Les clients comparent les prix sur leur téléphone en magasin.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Signal faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Tendance installée<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"4\"><p class=\"bq\">Une start-up propose un abonnement à des vélos d’occasion révisés, dans une seule ville.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Signal faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Tendance installée<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"5\"><p class=\"bq\">La seconde main progresse dans l’habillement depuis plusieurs années.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Signal faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Tendance installée<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><\/div><p class=\"lead\" id=\"bts-1_3\"><\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-btreset=\"1.3\">Recommencer<\/button><\/div><p class=\"msg\" id=\"msg-1_3\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Bilan de la partie 1\" class=\"slide\" data-keep=\"1\" data-title=\"Partie 1 : ma progression\" data-ch=\"Partie 1 · Cadrage\">\n  <div class=\"in\">\n    <h2>Partie 1 : ma progression<\/h2><div class=\"progbox\" data-s=\"1\"><\/div><div class=\"stack\" style=\"gap:6px\"><span class=\"lab\">Mettre votre travail à l’abri<\/span><p class=\"small\">Vos réponses restent dans ce navigateur. Enregistrez maintenant votre fichier .json : il vous suit sur n’importe quel appareil, même si le navigateur est vidé.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-save=\"1\">Enregistrer mon travail (.json)<\/button><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Ouverture de la partie 2\" class=\"slide dark opener\" data-title=\"Partie 2\" data-ch=\"Partie 2 · Les outils\">\n  <div class=\"in\"><h1>Partie 2 : les outils de collecte et d’analyse<\/h1><\/div>\n<\/section>\n\n<section data-sec=\"Le cours\" class=\"slide\" data-keep=\"1\" data-title=\"Le cours · partie 2\" data-ch=\"Partie 2 · Les outils\">\n  <div class=\"in\">\n    <h2>Le cours · partie 2 : les outils de collecte et d’analyse<\/h2><div class=\"iter cours\"><div class=\"itabs\" role=\"group\" aria-label=\"Écrans du cours\"><button type=\"button\" data-i=\"0\" aria-pressed=\"true\">1 · Le moteur ne fait pas tout<\/button><button type=\"button\" data-i=\"1\" aria-pressed=\"false\">2 · Les opérateurs de base<\/button><button type=\"button\" data-i=\"2\" aria-pressed=\"false\">3 · Les filtres avancés<\/button><button type=\"button\" data-i=\"3\" aria-pressed=\"false\">4 · L'IA, assistant d'analyse<\/button><button type=\"button\" data-i=\"4\" aria-pressed=\"false\">5 · Une consigne structurée<\/button><button type=\"button\" data-i=\"5\" aria-pressed=\"false\">6 · À retenir<\/button><\/div><div class=\"istep cpan\" data-i=\"0\"><ol class=\"fil\" aria-label=\"Fil rouge du cours\"><li class=\"fait\"><b>Cadrage<\/b><small>partie 1<\/small><\/li><li class=\"cur\" aria-current=\"step\"><b>Outils<\/b><small>partie 2<\/small><\/li><li class=\"\"><b>Collecte<\/b><small>partie 3<\/small><\/li><li class=\"\"><b>Traitement<\/b><small>partie 3<\/small><\/li><li class=\"\"><b>Rédaction<\/b><small>partie 3<\/small><\/li><li class=\"\"><b>Dépôt<\/b><small>partie 4<\/small><\/li><\/ol><p>Les premiers résultats ne sont pas les meilleurs. Ce sont souvent des <b>publicités<\/b> ou des pages bien <b>référencées<\/b>.<\/p><p>Les <b>opérateurs<\/b> restreignent la recherche. Ils font remonter les documents utiles.<\/p><div class=\"cex\"><span class=\"lab\">Exemple · Decathlon<\/span><p>Taper <code>decathlon occasion<\/code> donne surtout des pages de vente. Ce n’est pas de la veille.<\/p><\/div><\/div><div class=\"istep cpan\" data-i=\"1\" hidden><div class=\"ctb\"><table class=\"tbl\"><thead><tr><th>Opérateur<\/th><th>Effet<\/th><th>Exemple<\/th><\/tr><\/thead><tbody><tr><td><b>AND<\/b><\/td><td>Tous les mots. Sur Google, l’espace suffit.<\/td><td><code>decathlon AND location<\/code><\/td><\/tr><tr><td><b>OR<\/b>, en majuscules<\/td><td>L’un ou l’autre<\/td><td><code>occasion OR \"seconde main\"<\/code><\/td><\/tr><tr><td><b>Guillemets droits<\/b><\/td><td>L’expression exacte<\/td><td><code>\"seconde main\"<\/code><\/td><\/tr><tr><td><b>Le signe moins<\/b><\/td><td>Exclure un mot ou un site<\/td><td><code>decathlon -site:decathlon.fr<\/code><\/td><\/tr><\/tbody><\/table><\/div><p>Les guillemets se tapent droits dans le moteur. Dans votre dossier, recopiez la requête telle quelle.<\/p><\/div><div class=\"istep cpan\" data-i=\"2\" hidden><div class=\"ctb\"><table class=\"tbl\"><thead><tr><th>Filtre<\/th><th>Effet<\/th><th>Exemple<\/th><\/tr><\/thead><tbody><tr><td><b>site:<\/b><\/td><td>Un site ou un domaine<\/td><td><code>site:.gouv.fr<\/code><\/td><\/tr><tr><td><b>filetype:<\/b><\/td><td>Un type de fichier<\/td><td><code>filetype:pdf<\/code><\/td><\/tr><tr><td><b>intitle:<\/b><\/td><td>Un mot dans le titre<\/td><td><code>intitle:decathlon<\/code><\/td><\/tr><tr><td><b>Date<\/b><\/td><td>Les résultats récents<\/td><td>Outils, puis « Date » ; ou <code>after:2025-01-01<\/code><\/td><\/tr><\/tbody><\/table><\/div><div class=\"cex\"><span class=\"lab\">Exemple · Decathlon<\/span><p>Une requête complète :<\/p><p><code>\"seconde main\" sport filetype:pdf site:.gouv.fr<\/code><\/p><p>Elle cherche des documents PDF d’administrations sur la seconde main dans le sport.<\/p><\/div><\/div><div class=\"istep cpan\" data-i=\"3\" hidden><p>L’IA ne cherche pas à votre place : elle <b>lit<\/b> et <b>structure<\/b> les sources que vous lui donnez.<\/p><p>Elle passe d’un texte brut à une synthèse : données clés, enjeux, questions ouvertes.<\/p><div class=\"cdef\"><b>Attention :<\/b> elle peut <b>inventer<\/b> un chiffre ou une source plausible. Chaque chiffre se vérifie dans le document d’origine.<\/div><\/div><div class=\"istep cpan\" data-i=\"4\" hidden><div class=\"ctb\"><table class=\"tbl\"><thead><tr><th>Élément<\/th><th>Exemple<\/th><\/tr><\/thead><tbody><tr><td><b>Rôle<\/b><\/td><td>Tu es analyste en veille stratégique dans le commerce du sport.<\/td><\/tr><tr><td><b>Objectif<\/b><\/td><td>Repérer ce qui peut changer la stratégie de Decathlon sur la seconde main.<\/td><\/tr><tr><td><b>Matériau<\/b><\/td><td>Utilise seulement les cinq sources jointes. N’invente rien.<\/td><\/tr><tr><td><b>Format<\/b><\/td><td>Un tableau : donnée clé, source, enjeu. Puis un signal faible en deux lignes.<\/td><\/tr><\/tbody><\/table><\/div><p>Ajoutez une <b>règle de vérification<\/b> : « Pour chaque chiffre, cite la source et la phrase exacte. »<\/p><\/div><div class=\"istep cpan\" data-i=\"5\" hidden><ul class=\"cli\"><li>Les opérateurs restreignent, les filtres qualifient ;<\/li><li>OR en majuscules, guillemets droits pour l’expression exacte ;<\/li><li>site: et filetype: trouvent les documents institutionnels ;<\/li><li>l’IA structure vos sources, elle ne les remplace pas ;<\/li><li>une consigne : rôle, objectif, matériau, format.<\/li><\/ul><details class=\"cq\"><summary>Je vérifie : comment trouver un PDF du gouvernement sur le marché du cycle ?<\/summary><p>Avec les guillemets et deux filtres : <code>\"marché du cycle\" filetype:pdf site:.gouv.fr<\/code>.<\/p><\/details><details class=\"cq\"><summary>Je vérifie : l’IA donne un chiffre absent de vos sources. Que faites-vous ?<\/summary><p>Vous le cherchez dans le document d’origine. Introuvable, vous le retirez.<\/p><\/details><div class=\"actions\"><button class=\"btn\" type=\"button\" data-goto=\"2.1 · Échauffement : le PDF institutionnel\">Commencer l’échauffement 2.1<\/button><\/div><\/div><\/div><p class=\"small csrc\"><a class=\"fdl\" href=\"https://pierrickbriand.github.io/veille-professionnelle-l3/fiches-cours-veille-professionnelle-l3.pdf\" target=\"_blank\" rel=\"noopener\" download>Télécharger les fiches de cours (PDF)<\/a> · Sources Decathlon : communiqué de presse « Résultats annuels 2025 », Decathlon, 2 avril 2026 (decathlon-united.media) ; Intersport : dépêche AFP reprise par FashionUnited, 9 avril 2026. Consultés le 20 octobre 2026.<\/p>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Échauffement\" class=\"slide\" data-title=\"2.1 · Échauffement : le PDF institutionnel\" data-ch=\"Partie 2 · Les outils\" data-ex=\"2.1\" data-min=\"10\" data-s=\"2\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 2 · activité 2.1<\/p><h2>Trouver un PDF institutionnel avec les opérateurs<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Trouvez un document PDF d’un site .gouv.fr ou .org sur le marché du cycle ou sur l’impact environnemental du textile.<\/p><p>Notez la requête exacte qui l’a trouvé, puis une information utile du document.<\/p><p class=\"small\"><b>À remplir ici<\/b> : votre requête exacte, le document trouvé, son organisme, sa date, une information utile, puis les opérateurs utilisés.<\/p><\/div><div class=\"exf\"><div class=\"iter grp\"><div class=\"itabs\" role=\"group\" aria-label=\"Étapes\"><button type=\"button\" data-i=\"0\" aria-pressed=\"true\">La requête<\/button><button type=\"button\" data-i=\"1\" aria-pressed=\"false\">Le document<\/button><button type=\"button\" data-i=\"2\" aria-pressed=\"false\">Les opérateurs<\/button><\/div><div class=\"istep\" data-i=\"0\"><div class=\"fld\"><label for=\"f-ech_req\">Votre requête exacte, telle que tapée<\/label><input type=\"text\" data-k=\"ech_req\" placeholder=\"Ex. l’expression entre guillemets, filetype:pdf site:.gouv.fr\"><\/div><\/div><div class=\"istep\" data-i=\"1\" hidden><div class=\"fld\"><label for=\"f-ech_titre\">Le titre du document<\/label><input type=\"text\" data-k=\"ech_titre\"><\/div><div class=\"fld\"><label for=\"f-ech_org\">L’organisme et l’adresse du document<\/label><input type=\"text\" data-k=\"ech_org\" placeholder=\"Ministère, agence, fédération, association\"><\/div><div class=\"fld\"><label for=\"f-ech_date\">La date du document<\/label><input type=\"text\" data-k=\"ech_date\" placeholder=\"Jour, mois, année\"><\/div><div class=\"fld\"><label for=\"f-ech_info\">Une information utile, avec la page<\/label><textarea data-k=\"ech_info\" rows=\"2\" placeholder=\"Un chiffre ou un fait, et la page où il se trouve\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"2\" hidden><div class=\"fld\"><span class=\"lb\">Les opérateurs et filtres utilisés<\/span><label class=\"chk\"><input type=\"checkbox\" data-g=\"ech_ops\" value=\"les guillemets\">Les guillemets<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"ech_ops\" value=\"OR\">OR<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"ech_ops\" value=\"le signe moins\">Le signe moins<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"ech_ops\" value=\"le filtre site:\">Le filtre site:<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"ech_ops\" value=\"le filtre filetype:\">Le filtre filetype:<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"ech_ops\" value=\"un filtre de date\">Un filtre de date<\/label><\/div><\/div><\/div><p class=\"msg\" id=\"msg-2_1\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Échauffement\" class=\"slide\" data-title=\"2.2 · Bien construite ou à corriger ?\" data-ch=\"Partie 2 · Les outils\" data-ex=\"2.2\" data-min=\"5\" data-s=\"2\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 2 · activité 2.2<\/p><h2>Cette recherche est-elle bien construite ?<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Jugez chaque façon de chercher.<\/p><p>Une bonne requête combine des mots-clés précis et un ou deux filtres.<\/p><p class=\"small\"><b>À remplir ici<\/b> : six réponses en cliquant. Votre score s’affiche.<\/p><\/div><div class=\"exf\"><div class=\"blind\" data-blind=\"2.2\"><div class=\"bt\" data-i=\"0\"><p class=\"bq\">Taper seulement decathlon pour trouver des études sur la seconde main.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Bien construite<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">À corriger<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"1\"><p class=\"bq\">Chercher decathlon intersport site:lsa-conso.fr pour comparer les deux enseignes dans la presse professionnelle.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Bien construite<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">À corriger<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"2\"><p class=\"bq\">Écrire or en minuscules entre occasion et reconditionné.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Bien construite<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">À corriger<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"3\"><p class=\"bq\">Ajouter filetype:pdf site:.gouv.fr pour trouver un rapport public.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Bien construite<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">À corriger<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"4\"><p class=\"bq\">Ajouter -site:decathlon.fr pour écarter les pages de la marque.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Bien construite<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">À corriger<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"5\"><p class=\"bq\">Taper une question entière : quelles sont les nouveautés de Decathlon en logistique cette année ?<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Bien construite<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">À corriger<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><\/div><p class=\"lead\" id=\"bts-2_2\"><\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-btreset=\"2.2\">Recommencer<\/button><\/div><p class=\"msg\" id=\"msg-2_2\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Échauffement\" class=\"slide facult\" data-title=\"2.3 · Quiz · opérateurs et IA\" data-ch=\"Partie 2 · Les outils\" data-ex=\"2.3\" data-min=\"5\" data-s=\"2\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 2 · activité 2.3 · facultative<\/p><h2>Quiz : les opérateurs et l’IA<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Une seule bonne réponse par question.<\/p><p>Lisez l’explication avant de passer à la suivante.<\/p><p class=\"small\"><b>À remplir ici<\/b> : quatre réponses en cliquant. Votre score s’affiche.<\/p><\/div><div class=\"exf\"><div class=\"quizg\" data-quiz=\"2.3\"><div class=\"pq qz\" data-i=\"0\"><p><b>1.<\/b> Pour ne garder que les documents PDF, vous ajoutez…<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">site:pdf<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">filetype:pdf<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">intitle:pdf<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">pdf OR<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"pq qz\" data-i=\"1\"><p><b>2.<\/b> Les guillemets autour de « seconde main » servent à…<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">exclure ces mots<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">chercher l’expression exacte<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">chercher l’un ou l’autre<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">trier par date<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"pq qz\" data-i=\"2\"><p><b>3.<\/b> Une consigne utile pour l’IA commence par…<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">un rôle et un objectif<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">une formule de politesse<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">le nom de l’IA<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">une question vague<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"pq qz\" data-i=\"3\"><p><b>4.<\/b> L’IA cite une étude absente de vos sources. Que faites-vous ?<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">Je la garde<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">Je cherche l’étude ; introuvable, je la retire<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">Je l’arrondis<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">Je change d’outil<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><\/div><p class=\"lead\" id=\"qzs-2_3\"><\/p><p class=\"msg\" id=\"msg-2_3\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Prendre en main Claude\" class=\"slide dark opener\" data-title=\"Prendre en main Claude\" data-ch=\"Prendre en main Claude\">\n  <div class=\"in\"><h1>Prendre en main Claude<\/h1><\/div>\n<\/section>\n\n<section data-sec=\"Prendre en main Claude\" class=\"slide\" data-title=\"Votre poste de travail Claude\" data-ch=\"Prendre en main Claude\">\n  <div class=\"in\">\n    <h2>Votre poste de travail Claude<\/h2><div class=\"rows\"><div class=\"row\"><span class=\"k\">Conversation<\/span><span>Un fil d’échange. Claude garde le contexte du fil, pas celui des autres conversations.<\/span><\/div><div class=\"row\"><span class=\"k\">Modèle et effort<\/span><span>Cliquez sur le nom du modèle, à côté du bouton d’envoi. Haiku pour une tâche rapide, Sonnet pour un travail exigeant.<\/span><\/div><div class=\"row\"><span class=\"k\">Pièce jointe<\/span><span>Bouton « + », puis « Ajouter des fichiers ou des photos » (« Add files or photos »). Claude lit le fichier, vous vérifiez ce qu’il en tire.<\/span><\/div><div class=\"row\"><span class=\"k\">Recherche web<\/span><span>Bouton « + », puis « Recherche web » (« Web search »). Dans la nouvelle version de Claude, pas de bouton : il cherche quand c’est utile. Ouvrez chaque source citée.<\/span><\/div><\/div><p class=\"small\">Les libellés de l’interface changent souvent. Repérez les icônes : le nom du modèle, le bouton « + », le volet de gauche.<\/p>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Prendre en main Claude\" class=\"slide\" data-title=\"Offre gratuite ou payante ?\" data-ch=\"Prendre en main Claude\">\n  <div class=\"in\">\n    <h2>Offre gratuite ou payante ?<\/h2><div class=\"rows\"><div class=\"row\"><span class=\"k\">Gratuit<\/span><span>Haiku (dont Haiku 5.5) et Sonnet, pièces jointes et recherche web. Il suffit pour ce cours.<\/span><\/div><div class=\"row\"><span class=\"k\">Limite d’usage<\/span><span>Elle se réinitialise toutes les cinq heures. La recherche web et un effort élevé la consomment plus vite.<\/span><\/div><div class=\"row\"><span class=\"k\">Payant<\/span><span>Pour un usage régulier : plus d’usage, des modèles plus puissants, des projets illimités.<\/span><\/div><div class=\"row\"><span class=\"k\">En cours<\/span><span>Limite atteinte ? Continuez la collecte à la main et reprenez l’IA plus tard.<\/span><\/div><\/div><p class=\"small\">Les offres et les prix sont sur claude.com/pricing. Vérifiez-les avant de vous abonner.<\/p>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Prendre en main Claude\" class=\"slide\" data-title=\"CL1 · Préparer son compte Claude\" data-ch=\"Prendre en main Claude\" data-ex=\"CL1\" data-min=\"5\" data-s=\"2\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 2 · activité CL1<\/p><h2>Régler Claude avant de travailler<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Connectez-vous à claude.ai avec votre compte personnel, gratuit ou payant.<\/p><p>Vérifiez chaque réglage, puis notez le modèle proposé par défaut.<\/p><p class=\"small\"><b>À remplir ici<\/b> : quatre réglages cochés, le nom du modèle et votre réponse sur le menu « Effort ».<\/p><\/div><div class=\"exf\"><div class=\"fld\"><span class=\"lb\">Réglages vérifiés<\/span><label class=\"chk\"><input type=\"checkbox\" data-g=\"cl1_ok\" value=\"Compte créé et connecté\">Compte créé et connecté<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"cl1_ok\" value=\"Sélecteur de modèle repéré, à côté du bouton d’envoi\">Sélecteur de modèle repéré, à côté du bouton d’envoi<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"cl1_ok\" value=\"Bouton « + » repéré : fichiers et recherche web\">Bouton « + » repéré : fichiers et recherche web<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"cl1_ok\" value=\"Rubrique « Projets » repérée dans le volet de gauche\">Rubrique « Projets » repérée dans le volet de gauche<\/label><\/div><div class=\"fld\"><label for=\"f-cl1_mod\">Modèle proposé par défaut<\/label><input type=\"text\" data-k=\"cl1_mod\" placeholder=\"Ex. Sonnet\"><\/div><div class=\"fld\"><label for=\"f-cl1_eff\">Le menu « Effort » apparaît-il sur votre compte ?<\/label><select data-k=\"cl1_eff\"><option value=\"\">Choisir…<\/option><option>Oui<\/option><option>Non<\/option><option>Je ne sais pas<\/option><\/select><\/div><p class=\"msg\" id=\"msg-CL1\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Prendre en main Claude\" class=\"slide facult\" data-title=\"CL2 · Quel modèle pour quelle tâche ?\" data-ch=\"Prendre en main Claude\" data-ex=\"CL2\" data-min=\"5\" data-s=\"2\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 2 · activité CL2 · facultative<\/p><h2>Rapide et léger, ou puissant et réfléchi ?<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Pour chaque tâche, choisissez le réglage le plus adapté.<\/p><p>Plus d’effort donne une réponse plus soignée, mais plus lente, et consomme plus vite votre limite.<\/p><p class=\"small\"><b>À remplir ici<\/b> : six réponses en cliquant. Votre score s’affiche.<\/p><\/div><div class=\"exf\"><div class=\"blind\" data-blind=\"CL2\"><div class=\"bt\" data-i=\"0\"><p class=\"bq\">Corriger l’orthographe d’un paragraphe du dossier.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Haiku, effort faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Sonnet, effort élevé<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"1\"><p class=\"bq\">Croiser cinq sources pour en tirer les enjeux et un signal faible.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Haiku, effort faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Sonnet, effort élevé<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"2\"><p class=\"bq\">Proposer dix synonymes pour vos mots-clés.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Haiku, effort faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Sonnet, effort élevé<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"3\"><p class=\"bq\">Repérer les contradictions entre un communiqué et deux articles de presse.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Haiku, effort faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Sonnet, effort élevé<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"4\"><p class=\"bq\">Reformuler le titre de votre dossier.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Haiku, effort faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Sonnet, effort élevé<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"bt\" data-i=\"5\"><p class=\"bq\">Vérifier qu’une affirmation juridique sur la réparation est exacte.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-v=\"1\">Haiku, effort faible<\/button><button class=\"btn\" type=\"button\" data-v=\"0\">Sonnet, effort élevé<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><\/div><p class=\"lead\" id=\"bts-CL2\"><\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-btreset=\"CL2\">Recommencer<\/button><\/div><p class=\"msg\" id=\"msg-CL2\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Prendre en main Claude\" class=\"slide\" data-title=\"CL3 · Joindre un fichier\" data-ch=\"Prendre en main Claude\" data-ex=\"CL3\" data-min=\"8\" data-s=\"2\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 2 · activité CL3<\/p><h2>Faire travailler Claude sur un fichier joint<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Téléchargez la fiche méthode du cours, puis joignez-la à une nouvelle conversation avec le bouton « + ».<\/p><p>Posez une question dont la réponse se trouve dans la fiche. Vérifiez la réponse dans le fichier.<\/p><p class=\"small\"><b>À remplir ici<\/b> : votre question, la réponse de Claude en deux lignes et votre vérification.<\/p><div class=\"stack\" style=\"gap:6px\"><div class=\"actions\"><button class=\"btn\" type=\"button\" data-dl=\"fiche\">Télécharger la fiche méthode (.md)<\/button><\/div><span class=\"msg\" id=\"dl-msg\" aria-live=\"polite\"><\/span><\/div><\/div><div class=\"exf\"><div class=\"fld\"><label for=\"f-cl3_q\">Votre question<\/label><textarea data-k=\"cl3_q\" rows=\"2\" placeholder=\"Ex. Quel filtre limite la recherche à un type de fichier ?\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-cl3_r\">Ce que Claude a répondu<\/label><textarea data-k=\"cl3_r\" rows=\"2\" placeholder=\"Un résumé en deux lignes\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-cl3_v\">La réponse est-elle fidèle au fichier ?<\/label><select data-k=\"cl3_v\"><option value=\"\">Choisir…<\/option><option>Oui, entièrement<\/option><option>En partie<\/option><option>Non<\/option><\/select><\/div><div class=\"fld\"><label for=\"f-cl3_e\">Un ajout ou une erreur de Claude, si la réponse n’est pas entièrement fidèle<\/label><textarea data-k=\"cl3_e\" rows=\"2\" placeholder=\"Ce qu’il affirme alors que ce n’est pas dans le fichier\"><\/textarea><\/div><p class=\"msg\" id=\"msg-CL3\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Bilan de la partie 2\" class=\"slide\" data-keep=\"1\" data-title=\"Partie 2 : ma progression\" data-ch=\"Partie 2 · Les outils\">\n  <div class=\"in\">\n    <h2>Partie 2 : ma progression<\/h2><div class=\"progbox\" data-s=\"2\"><\/div><div class=\"stack\" style=\"gap:6px\"><span class=\"lab\">Mettre votre travail à l’abri<\/span><p class=\"small\">Vos réponses restent dans ce navigateur. Enregistrez maintenant votre fichier .json : il vous suit sur n’importe quel appareil, même si le navigateur est vidé.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-save=\"1\">Enregistrer mon travail (.json)<\/button><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Ouverture de la partie 3\" class=\"slide dark opener\" data-title=\"Partie 3\" data-ch=\"Partie 3 · L’atelier\">\n  <div class=\"in\"><h1>Partie 3 : l’atelier pratique individuel<\/h1><\/div>\n<\/section>\n\n<section data-sec=\"Ouverture de la partie 3\" class=\"slide\" data-title=\"L’atelier : le déroulé\" data-ch=\"Partie 3 · L’atelier\">\n  <div class=\"in\">\n    <h2>L’atelier : deux heures en trois temps<\/h2><div class=\"rows\"><div class=\"row\"><span class=\"k\">15&nbsp;h&nbsp;00 – 15&nbsp;h&nbsp;45<\/span><span>Collecte : votre angle, vos requêtes, cinq sources (3.1 et 3.2).<\/span><\/div><div class=\"row\"><span class=\"k\">15&nbsp;h&nbsp;45 – 16&nbsp;h&nbsp;15<\/span><span>Traitement : votre consigne, la réponse de l’IA, vos corrections (3.3).<\/span><\/div><div class=\"row\"><span class=\"k\">16&nbsp;h&nbsp;15 – 17&nbsp;h&nbsp;00<\/span><span>Rédaction : le dossier, puis l’export en PDF (3.5).<\/span><\/div><\/div><p class=\"small\">Bloqué sur une requête ? Levez la main : l’enseignant circule dans les rangs.<\/p>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Le cours\" class=\"slide\" data-keep=\"1\" data-title=\"Le cours · partie 3\" data-ch=\"Partie 3 · L’atelier\">\n  <div class=\"in\">\n    <h2>Le cours · partie 3 : la méthode de l’atelier<\/h2><div class=\"iter cours\"><div class=\"itabs\" role=\"group\" aria-label=\"Écrans du cours\"><button type=\"button\" data-i=\"0\" aria-pressed=\"true\">1 · Choisir son angle<\/button><button type=\"button\" data-i=\"1\" aria-pressed=\"false\">2 · Une source fiable<\/button><button type=\"button\" data-i=\"2\" aria-pressed=\"false\">3 · Traiter avec l'IA<\/button><button type=\"button\" data-i=\"3\" aria-pressed=\"false\">4 · Le dossier<\/button><button type=\"button\" data-i=\"4\" aria-pressed=\"false\">5 · La grille<\/button><button type=\"button\" data-i=\"5\" aria-pressed=\"false\">6 · À retenir<\/button><\/div><div class=\"istep cpan\" data-i=\"0\"><ol class=\"fil\" aria-label=\"Fil rouge du cours\"><li class=\"fait\"><b>Cadrage<\/b><small>partie 1<\/small><\/li><li class=\"fait\"><b>Outils<\/b><small>partie 2<\/small><\/li><li class=\"cur\" aria-current=\"step\"><b>Collecte<\/b><small>partie 3<\/small><\/li><li class=\"\"><b>Traitement<\/b><small>partie 3<\/small><\/li><li class=\"\"><b>Rédaction<\/b><small>partie 3<\/small><\/li><li class=\"\"><b>Dépôt<\/b><small>partie 4<\/small><\/li><\/ol><p>Un angle, c’est <b>une question précise<\/b> sur Decathlon.<\/p><ul class=\"cli\"><li>La seconde main et la réparation ;<\/li><li>la concurrence avec Intersport ;<\/li><li>l’innovation logistique ;<\/li><li>la location plutôt que la vente ;<\/li><li>les marques propres.<\/li><\/ul><div class=\"cex\"><span class=\"lab\">Exemple · Decathlon<\/span><p>Trop large : « Decathlon et l’environnement ».<\/p><p>Précis : « La location de vélos d’entreprise peut-elle devenir un métier de Decathlon ? »<\/p><\/div><\/div><div class=\"istep cpan\" data-i=\"1\" hidden><div class=\"ctb\"><table class=\"tbl\"><thead><tr><th>Question<\/th><th>Ce qu’on vérifie<\/th><\/tr><\/thead><tbody><tr><td><b>Qui parle ?<\/b><\/td><td>Un auteur, un média, un organisme identifié<\/td><\/tr><tr><td><b>Quand ?<\/b><\/td><td>Une date, de préférence de moins de deux ans<\/td><\/tr><tr><td><b>Pourquoi ?<\/b><\/td><td>Informer, ou vendre ? Une page de vente s’écarte<\/td><\/tr><tr><td><b>Sur quoi ?<\/b><\/td><td>Des chiffres sourcés, une méthode<\/td><\/tr><tr><td><b>Recoupée ?<\/b><\/td><td>Une deuxième source dit-elle la même chose ?<\/td><\/tr><\/tbody><\/table><\/div><p>Variez les types : presse économique, document technique, données publiques.<\/p><\/div><div class=\"istep cpan\" data-i=\"2\" hidden><ul class=\"cli\"><li>Joignez vos sources, ou collez leurs extraits ;<\/li><li>envoyez votre consigne : rôle, objectif, matériau, format ;<\/li><li>relisez la réponse ligne par ligne ;<\/li><li>vérifiez chaque chiffre dans sa source ;<\/li><li>corrigez, et notez ce que vous avez corrigé.<\/li><\/ul><p>Ce que vous corrigez compte dans la note. Une réponse acceptée sans contrôle, non.<\/p><\/div><div class=\"istep cpan\" data-i=\"3\" hidden><div class=\"ctb\"><table class=\"tbl\"><thead><tr><th>Partie<\/th><th>Contenu<\/th><\/tr><\/thead><tbody><tr><td>Synthèse<\/td><td>Le signal faible en deux phrases<\/td><\/tr><tr><td>1. L’angle<\/td><td>La question de veille, l’axe, le contexte<\/td><\/tr><tr><td>2. La méthode<\/td><td>Les mots-clés, les requêtes, les filtres, le tri<\/td><\/tr><tr><td>3. L’analyse<\/td><td>Les faits clés, les enjeux, ce que Decathlon doit surveiller<\/td><\/tr><tr><td>4. La critique<\/td><td>Les erreurs de l’IA corrigées, les limites<\/td><\/tr><tr><td>Annexes<\/td><td>Les sources exactes, la consigne de base<\/td><\/tr><\/tbody><\/table><\/div><p><b>3 à 4 pages<\/b> pour le corps du dossier. L’export compte les pages.<\/p><\/div><div class=\"istep cpan\" data-i=\"4\" hidden><div class=\"ctb\"><table class=\"tbl\"><thead><tr><th>Critère<\/th><th>Points<\/th><\/tr><\/thead><tbody><tr><td>Recherche : opérateurs, filtres, méthode retracée<\/td><td>5<\/td><\/tr><tr><td>Sources : récentes, variées, fiables, triées<\/td><td>5<\/td><\/tr><tr><td>IA : consigne fournie, rôle et objectif, esprit critique<\/td><td>5<\/td><\/tr><tr><td>Rédaction : 3 à 4 pages, signal clair, mise en page<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div><p>La grille est rappelée dans l’aide de chaque activité de l’atelier.<\/p><\/div><div class=\"istep cpan\" data-i=\"5\" hidden><ul class=\"cli\"><li>Une question précise vaut mieux qu’un thème large ;<\/li><li>cinq sources récentes, variées, fiables ;<\/li><li>l’IA traite, vous vérifiez ;<\/li><li>le signal faible ressort dès la synthèse.<\/li><\/ul><details class=\"cq\"><summary>Je vérifie : la fiche produit d’un site marchand, bonne source ?<\/summary><p>Non pour l’analyse. Elle vend. Gardez-la seulement pour relever un prix, avec sa date.<\/p><\/details><details class=\"cq\"><summary>Je vérifie : où mettre la consigne envoyée à l’IA ?<\/summary><p>En annexe, telle que vous l’avez envoyée.<\/p><\/details><div class=\"actions\"><button class=\"btn\" type=\"button\" data-goto=\"3.1 · Mon angle et mon signal\">Commencer l’activité 3.1<\/button><\/div><\/div><\/div><p class=\"small csrc\"><a class=\"fdl\" href=\"https://pierrickbriand.github.io/veille-professionnelle-l3/fiches-cours-veille-professionnelle-l3.pdf\" target=\"_blank\" rel=\"noopener\" download>Télécharger les fiches de cours (PDF)<\/a> · Sources Decathlon : communiqué de presse « Résultats annuels 2025 », Decathlon, 2 avril 2026 (decathlon-united.media) ; Intersport : dépêche AFP reprise par FashionUnited, 9 avril 2026. Consultés le 20 octobre 2026.<\/p>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Collecte\" class=\"slide\" data-title=\"3.1 · Mon angle et mon signal\" data-ch=\"Partie 3 · L’atelier\" data-ex=\"3.1\" data-min=\"10\" data-s=\"3\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 3 · activité 3.1 · dossier de veille<\/p><h2>Choisir son angle et formuler sa question de veille<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Choisissez un angle sur Decathlon et formulez une question précise.<\/p><p>Notez le signal faible que vous pressentez : vos sources le confirmeront ou non.<\/p><p class=\"small\"><b>À remplir ici<\/b> : votre angle, votre question de veille, l’axe de veille, puis le signal faible pressenti.<\/p><\/div><div class=\"exf\"><div class=\"iter grp\"><div class=\"itabs\" role=\"group\" aria-label=\"Étapes\"><button type=\"button\" data-i=\"0\" aria-pressed=\"true\">L’angle<\/button><button type=\"button\" data-i=\"1\" aria-pressed=\"false\">L’axe et le lecteur<\/button><button type=\"button\" data-i=\"2\" aria-pressed=\"false\">Le signal pressenti<\/button><\/div><div class=\"istep\" data-i=\"0\"><div class=\"fld\"><label for=\"f-an_angle\">Votre angle d’attaque<\/label><select data-k=\"an_angle\"><option value=\"\">Choisir…<\/option><option>La seconde main et la réparation<\/option><option>La concurrence avec Intersport<\/option><option>L’innovation logistique<\/option><option>La location plutôt que la vente<\/option><option>Les marques propres<\/option><option>Un autre angle<\/option><\/select><\/div><div class=\"fld\"><label for=\"f-an_autre\">Si vous avez choisi « Un autre angle » : lequel ?<\/label><input type=\"text\" data-k=\"an_autre\" placeholder=\"Laissez vide sinon\"><\/div><div class=\"fld\"><label for=\"f-an_q\">Votre question de veille, en une phrase<\/label><textarea data-k=\"an_q\" rows=\"2\" placeholder=\"Ex. La location de vélos d’entreprise peut-elle devenir un métier de Decathlon ?\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"1\" hidden><div class=\"fld\"><label for=\"f-an_axe\">L’axe de veille principal<\/label><select data-k=\"an_axe\"><option value=\"\">Choisir…<\/option><option>Concurrentielle<\/option><option>Technologique<\/option><option>Légale<\/option><option>Sociétale<\/option><\/select><\/div><div class=\"fld\"><label for=\"f-an_serv\">Le service qui lirait votre dossier<\/label><select data-k=\"an_serv\"><option value=\"\">Choisir…<\/option><option>La direction<\/option><option>Le marketing<\/option><option>Les achats<\/option><\/select><\/div><\/div><div class=\"istep\" data-i=\"2\" hidden><div class=\"fld\"><label for=\"f-an_hyp\">Le signal faible que vous pressentez<\/label><textarea data-k=\"an_hyp\" rows=\"2\" placeholder=\"Ce que vous pensez voir venir, et pourquoi\"><\/textarea><\/div><\/div><\/div><p class=\"msg\" id=\"msg-3_1\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Collecte\" class=\"slide\" data-title=\"3.2 · Collecte : requêtes et cinq sources\" data-ch=\"Partie 3 · L’atelier\" data-ex=\"3.2\" data-min=\"45\" data-s=\"3\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 3 · activité 3.2 · dossier de veille<\/p><h2>Collecter cinq sources pertinentes et récentes<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Construisez vos requêtes booléennes et notez-les telles que vous les tapez.<\/p><p>Retenez cinq sources récentes, variées et fiables. Écartez les pages publicitaires et dites pourquoi.<\/p><p class=\"small\"><b>À remplir ici<\/b> : vos mots-clés, trois requêtes, les filtres utilisés, cinq fiches sources, puis une source écartée.<\/p><\/div><div class=\"exf\"><div class=\"iter grp\"><div class=\"itabs\" role=\"group\" aria-label  class=\"iter grp\"><div class=\"itabs\" role=\"group\" aria-label=\"Étapes\"><button type=\"button\" data-i=\"0\" aria-pressed=\"true\">Ma consigne<\/button><button type=\"button\" data-i=\"1\" aria-pressed=\"false\">L’envoi<\/button><button type=\"button\" data-i=\"2\" aria-pressed=\"false\">L’esprit critique<\/button><\/div><div class=\"istep\" data-i=\"0\"><div class=\"fld\"><label for=\"f-ia_role\">Le rôle donné à l’IA<\/label><input type=\"text\" data-k=\"ia_role\" placeholder=\"Ex. Tu es analyste en veille stratégique dans le commerce du sport.\"><\/div><div class=\"fld\"><label for=\"f-ia_obj\">L’objectif<\/label><textarea data-k=\"ia_obj\" rows=\"2\" placeholder=\"Ex. Repérer ce qui peut changer la stratégie de Decathlon sur la seconde main.\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-ia_mat\">Le matériau et les règles<\/label><textarea data-k=\"ia_mat\" rows=\"2\" placeholder=\"Ex. Utilise seulement les cinq sources jointes. N’invente rien. Pour chaque chiffre, cite la source.\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-ia_format\">Le format attendu<\/label><textarea data-k=\"ia_format\" rows=\"2\" placeholder=\"Ex. Un tableau : donnée clé, source, enjeu. Puis un signal faible en deux lignes.\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"1\" hidden><div class=\"fld\"><label for=\"f-ia_prompt\">La consigne envoyée, telle quelle<\/label><textarea data-k=\"ia_prompt\" rows=\"4\" placeholder=\"Collez ici la consigne complète que vous avez envoyée\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-ia_outil\">L’outil, le modèle et la date<\/label><input type=\"text\" data-k=\"ia_outil\" placeholder=\"Ex. Claude, Sonnet, 21 octobre 2026\"><\/div><div class=\"fld\"><label for=\"f-ia_rep\">Ce que l’IA a répondu, en cinq lignes<\/label><textarea data-k=\"ia_rep\" rows=\"4\" placeholder=\"Les données clés et les enjeux qu’elle propose\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"2\" hidden><div class=\"fld\"><label for=\"f-ia_err\">Les erreurs ou incohérences repérées, et votre correction<\/label><textarea data-k=\"ia_err\" rows=\"3\" placeholder=\"Ex. un chiffre absent de la source, une date fausse, une source inventée\"><\/textarea><\/div><div class=\"fld\"><span class=\"lb\">Contrôle de la réponse<\/span><label class=\"chk\"><input type=\"checkbox\" data-g=\"ia_ctrl\" value=\"chaque chiffre retrouvé dans sa source\">Chaque chiffre retrouvé dans sa source<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"ia_ctrl\" value=\"les sources citées par l’IA existent\">Les sources citées par l’IA existent<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"ia_ctrl\" value=\"les ajouts hors de mes sources sont retirés\">Les ajouts hors de mes sources sont retirés<\/label><\/div><\/div><\/div><div class=\"actions\"><button class=\"btn\" type=\"button\" data-asm=\"3.3\">Copier ma consigne<\/button><\/div><p class=\"msg\" id=\"msg-3_3\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Traitement\" class=\"slide facult\" data-title=\"3.4 · Fil itéré · Claude analyste de veille\" data-ch=\"Partie 3 · L’atelier\" data-ex=\"3.4\" data-min=\"15\" data-s=\"3\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 3 · activité 3.4 · facultative<\/p><h2>Fil itéré : approfondir l’analyse avec Claude<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Ouvrez une nouvelle conversation sur claude.ai.<\/p><p>Envoyez les consignes une par une, dans le même fil. Notez à chaque tour ce que vous observez.<\/p><p class=\"small\"><b>À remplir ici<\/b> : vos observations sur chacun des quatre tours. Le fil, lui, se fait dans Claude.<\/p><\/div><div class=\"exf\"><div class=\"iter\" data-iter=\"3.4\"><div class=\"itabs\" role=\"group\" aria-label=\"Tours du fil\"><button type=\"button\" data-i=\"0\" aria-pressed=\"true\">Tour 1 · Extraire<\/button><button type=\"button\" data-i=\"1\" aria-pressed=\"false\">Tour 2 · Enjeux<\/button><button type=\"button\" data-i=\"2\" aria-pressed=\"false\">Tour 3 · Signal<\/button><button type=\"button\" data-i=\"3\" aria-pressed=\"false\">Tour 4 · Limites<\/button><button type=\"button\" data-i=\"4\" aria-pressed=\"false\">Votre analyse du fil<\/button><\/div><div class=\"istep\" data-i=\"0\"><span class=\"lab\">Consigne du tour 1<\/span><pre class=\"doc\">Tu es analyste en veille stratégique dans le commerce du sport. Voici mes sources sur Decathlon :\n[collez vos sources]\nPour chaque source, extrais deux données clés, avec la phrase exacte qui les contient.<\/pre><p class=\"mini\">En copiant, les crochets sont remplacés par vos réponses déjà saisies.<\/p><div class=\"actions\"><button class=\"btn\" type=\"button\" data-icopy=\"3.4:0\">Copier la consigne<\/button><\/div><div class=\"fld\"><label for=\"f-it_3_4_o0\">Ce que vous observez<\/label><textarea data-k=\"it_3_4_o0\" rows=\"2\" placeholder=\"Chaque phrase citée est-elle vraiment dans la source ?\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"1\" hidden><span class=\"lab\">Consigne du tour 2<\/span><pre class=\"doc\">À partir de ces seules données, quels enjeux pour Decathlon ? Classe-les du plus au moins important, en une ligne chacun.<\/pre><div class=\"actions\"><button class=\"btn\" type=\"button\" data-icopy=\"3.4:1\">Copier la consigne<\/button><\/div><div class=\"fld\"><label for=\"f-it_3_4_o1\">Ce que vous observez<\/label><textarea data-k=\"it_3_4_o1\" rows=\"2\" placeholder=\"Êtes-vous d’accord avec ce classement ?\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"2\" hidden><span class=\"lab\">Consigne du tour 3<\/span><pre class=\"doc\">Quel signal faible ces sources laissent-elles voir ? Donne ce qui le confirme et ce qui le contredit.<\/pre><div class=\"actions\"><button class=\"btn\" type=\"button\" data-icopy=\"3.4:2\">Copier la consigne<\/button><\/div><div class=\"fld\"><label for=\"f-it_3_4_o2\">Ce que vous observez<\/label><textarea data-k=\"it_3_4_o2\" rows=\"2\" placeholder=\"Le signal rejoint-il celui que vous pressentiez en 3.1 ?\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"3\" hidden><span class=\"lab\">Consigne du tour 4<\/span><pre class=\"doc\">Relis tes réponses. Qu’as-tu affirmé sans t’appuyer sur mes sources ? Liste ces points.<\/pre><div class=\"actions\"><button class=\"btn\" type=\"button\" data-icopy=\"3.4:3\">Copier la consigne<\/button><\/div><div class=\"fld\"><label for=\"f-it_3_4_o3\">Ce que vous observez<\/label><textarea data-k=\"it_3_4_o3\" rows=\"2\" placeholder=\"Claude reconnaît-il toutes ses limites ?\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"4\" hidden><p class=\"mini\">Une seule analyse pour les quatre tours, à faire une fois le fil terminé.<\/p><div class=\"reflex\"><span class=\"lab\">Votre analyse<\/span><div class=\"fr\"><div class=\"fld\"><label for=\"f-rf_3_4_fonction\">La notion du cours mobilisée<\/label><select data-k=\"rf_3_4_fonction\"><option value=\"\">Choisir…<\/option><option>Veille concurrentielle<\/option><option>Veille technologique<\/option><option>Veille légale<\/option><option>Veille sociétale<\/option><option>Opérateurs de recherche<\/option><option>Fiabilité des sources<\/option><option>Consigne structurée<\/option><option>Signal faible<\/option><\/select><\/div><\/div><div class=\"fr\"><div class=\"fld\"><label for=\"f-rf_3_4_avis\">Mon avis sur le résultat<\/label><textarea data-k=\"rf_3_4_avis\" rows=\"2\" placeholder=\"Utile, juste, prouvé ? Pourquoi ?\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-rf_3_4_amelio\">Une amélioration possible<\/label><textarea data-k=\"rf_3_4_amelio\" rows=\"2\" placeholder=\"Une règle, une donnée, une étape à ajouter\"><\/textarea><\/div><\/div><\/div><\/div><\/div><p class=\"msg\" id=\"msg-3_4\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Rédaction\" class=\"slide\" data-title=\"3.5 · Rédaction : le dossier\" data-ch=\"Partie 3 · L’atelier\" data-ex=\"3.5\" data-min=\"45\" data-s=\"3\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 3 · activité 3.5 · dossier de veille<\/p><h2>Rédiger le dossier de veille<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Rédigez chaque partie du dossier. Le bouton reprend vos réponses de 3.1 et 3.3 dans les parties vides.<\/p><p>Contrôlez, puis exportez le dossier en PDF : l’outil indique le nombre de pages.<\/p><p class=\"small\"><b>À remplir ici<\/b> : la synthèse, le contexte, l’analyse, les recommandations, les limites, puis le contrôle coché.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-mjfill=\"3.5\">Reprendre mes réponses de 3.1 et 3.3<\/button><\/div><span class=\"msg mjmsg\" aria-live=\"polite\"><\/span><p class=\"small\">Le bouton remplit seulement les parties vides. Réécrivez ensuite avec vos mots.<\/p><span class=\"lab\">Contrôler et exporter<\/span><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-cc1=\"check\">Vérifier ce qui manque<\/button><button class=\"btn\" type=\"button\" data-cc1=\"pdf\">Exporter le dossier (PDF)<\/button><\/div><div class=\"msg cc1-msg\" aria-live=\"polite\"><\/div><\/div><div class=\"exf\"><div class=\"iter grp\"><div class=\"itabs\" role=\"group\" aria-label=\"Étapes\"><button type=\"button\" data-i=\"0\" aria-pressed=\"true\">Synthèse et angle<\/button><button type=\"button\" data-i=\"1\" aria-pressed=\"false\">Analyse<\/button><button type=\"button\" data-i=\"2\" aria-pressed=\"false\">Limites et contrôle<\/button><\/div><div class=\"istep\" data-i=\"0\"><div class=\"fld\"><label for=\"f-rd_signal\">Synthèse : le signal faible en deux phrases<\/label><textarea data-k=\"rd_signal\" rows=\"3\" placeholder=\"Ce qui se passe, et pourquoi Decathlon doit s’en soucier\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-rd_contexte\">1. L’angle et le contexte<\/label><textarea data-k=\"rd_contexte\" rows=\"3\" placeholder=\"La question de veille, l’axe, ce qu’on sait déjà\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"1\" hidden><div class=\"fld\"><label for=\"f-rd_analyse\">3. L’analyse : les faits clés et les enjeux<\/label><textarea data-k=\"rd_analyse\" rows=\"6\" placeholder=\"Trois à cinq faits sourcés, et ce qu’ils changent\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-rd_impl\">3. Ce que Decathlon doit surveiller ou faire<\/label><textarea data-k=\"rd_impl\" rows=\"3\" placeholder=\"Deux ou trois pistes, et le service concerné\"><\/textarea><\/div><\/div><div class=\"istep\" data-i=\"2\" hidden><div class=\"fld\"><label for=\"f-rd_lim\">4. Les limites de votre veille<\/label><textarea data-k=\"rd_lim\" rows=\"2\" placeholder=\"Ce qui reste incertain, ce qu’il faudrait vérifier\"><\/textarea><\/div><div class=\"fld\"><span class=\"lb\">Contrôle avant l’export<\/span><label class=\"chk\"><input type=\"checkbox\" data-g=\"rd_ctrl\" value=\"le signal faible ressort dès la synthèse\">Le signal faible ressort dès la synthèse<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"rd_ctrl\" value=\"chaque chiffre a sa source\">Chaque chiffre a sa source<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"rd_ctrl\" value=\"la consigne de base est en annexe\">La consigne de base est en annexe<\/label><label class=\"chk\"><input type=\"checkbox\" data-g=\"rd_ctrl\" value=\"le corps du dossier tient en 4 pages\">Le corps du dossier tient en 4 pages<\/label><\/div><\/div><\/div><p class=\"msg\" id=\"msg-3_5\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Bilan de la partie 3\" class=\"slide\" data-keep=\"1\" data-title=\"Partie 3 : ma progression\" data-ch=\"Partie 3 · L’atelier\">\n  <div class=\"in\">\n    <h2>Partie 3 : ma progression<\/h2><div class=\"progbox\" data-s=\"3\"><\/div><div class=\"stack\" style=\"gap:6px\"><span class=\"lab\">Mettre votre travail à l’abri<\/span><p class=\"small\">Vos réponses restent dans ce navigateur. Enregistrez maintenant votre fichier .json : il vous suit sur n’importe quel appareil, même si le navigateur est vidé.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-save=\"1\">Enregistrer mon travail (.json)<\/button><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Ouverture de la partie 4\" class=\"slide dark opener\" data-title=\"Partie 4\" data-ch=\"Partie 4 · Dossier et dépôt\">\n  <div class=\"in\"><h1>Partie 4 : clôture et dépôt<\/h1><\/div>\n<\/section>\n\n<section data-sec=\"Tour de table\" class=\"slide\" data-title=\"4.1 · Les obstacles rencontrés\" data-ch=\"Partie 4 · Dossier et dépôt\" data-ex=\"4.1\" data-min=\"5\" data-s=\"4\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 4 · activité 4.1<\/p><h2>Préparer le tour de table : vos obstacles<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Notez le principal obstacle de votre collecte et la principale erreur de l’IA.<\/p><p>Ajoutez ce que vous referiez autrement. Vous en direz un mot au tour de table.<\/p><p class=\"small\"><b>À remplir ici<\/b> : un obstacle de collecte, une erreur de l’IA, puis ce que vous referiez autrement.<\/p><\/div><div class=\"exf\"><div class=\"fld\"><label for=\"f-ob_src\">L’obstacle de collecte<\/label><textarea data-k=\"ob_src\" rows=\"2\" placeholder=\"Ex. trop de pages de vente, peu de sources récentes\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-ob_ia\">L’erreur de l’IA la plus marquante<\/label><textarea data-k=\"ob_ia\" rows=\"2\" placeholder=\"Ex. un chiffre inventé, une source qui n’existe pas\"><\/textarea><\/div><div class=\"fld\"><label for=\"f-ob_refaire\">Ce que vous referiez autrement<\/label><textarea data-k=\"ob_refaire\" rows=\"2\" placeholder=\"Une requête, un filtre, une règle dans la consigne\"><\/textarea><\/div><p class=\"msg\" id=\"msg-4_1\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Socle Claude et test de fin\" class=\"slide\" data-title=\"CL6 · Quiz · le socle Claude\" data-ch=\"Prendre en main Claude\" data-ex=\"CL6\" data-min=\"5\" data-s=\"4\">\n  <div class=\"in\">\n    <header class=\"exh\"><div><p class=\"kick\">Partie 4 · activité CL6<\/p><h2>Ce que vous savez faire avec Claude<\/h2><\/div><div class=\"exr\"><div class=\"exnav\"><\/div><div class=\"timer\"><\/div><\/div><\/header>\n    <div class=\"excols\"><div class=\"exl\"><p>Une seule bonne réponse par question.<\/p><p>Lisez l’explication avant de passer à la suivante.<\/p><p class=\"small\"><b>À remplir ici<\/b> : quatre réponses en cliquant. Votre score s’affiche.<\/p><\/div><div class=\"exf\"><div class=\"quizg\" data-quiz=\"CL6\"><div class=\"pq qz\" data-i=\"0\"><p><b>1.<\/b> Vous voulez que Claude cherche des articles récents. Que faites-vous ?<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">Rien : il connaît toute l’actualité<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">Activer la recherche web, puis ouvrir chaque source citée<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">Changer de modèle<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">Joindre une image<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"pq qz\" data-i=\"1\"><p><b>2.<\/b> Claude cite un chiffre absent du fichier que vous avez joint. Que concluez-vous ?<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">Le fichier est abîmé<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">Le chiffre est juste, puisqu’il est précis<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">Claude a complété de lui-même : à vérifier<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">Il faut changer de modèle<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"pq qz\" data-i=\"2\"><p><b>3.<\/b> Une analyse croise cinq sources. Quel réglage choisir ?<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">Le modèle le plus rapide<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">N’importe lequel : le résultat est le même<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">Aucun : l’IA ne lit pas les PDF<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">Un modèle plus puissant, avec plus d’effort<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><div class=\"pq qz\" data-i=\"3\"><p><b>4.<\/b> Où mettre la consigne envoyée à Claude pour votre dossier ?<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-o=\"0\">Nulle part<\/button><button class=\"btn sec\" type=\"button\" data-o=\"1\">En annexe, telle qu’envoyée<\/button><button class=\"btn sec\" type=\"button\" data-o=\"2\">Dans le titre<\/button><button class=\"btn sec\" type=\"button\" data-o=\"3\">Dans la synthèse<\/button><\/div><p class=\"mini fbk\"><\/p><\/div><\/div><p class=\"lead\" id=\"qzs-CL6\"><\/p><p class=\"msg\" id=\"msg-CL6\"><\/p><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Socle Claude et test de fin\" class=\"slide\" data-title=\"Test de positionnement · fin\" data-ch=\"Partie 4 · Dossier et dépôt\">\n  <div class=\"in\">\n    <h2>Test de fin : mesurez votre progression<\/h2><p class=\"lead\">Les mêmes dix questions qu’en partie 5. Répondez, puis comparez vos deux scores.<\/p><div class=\"pos\" data-pos=\"1\"><\/div>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Le dépôt\" class=\"slide\" data-title=\"Déposer votre dossier\" data-ch=\"Partie 4 · Dossier et dépôt\">\n  <div class=\"in\">\n    <h2>Déposer votre dossier<\/h2><div class=\"rows\"><div class=\"row\"><span class=\"k\">Contenu<\/span><span>Votre dossier de veille, assemblé à partir des activités 3.1, 3.2, 3.3 et 3.5.<\/span><\/div><div class=\"row\"><span class=\"k\">Format<\/span><span>3 à 4 pages pour le corps, hors page de garde et annexes, en PDF. L’export indique le nombre de pages.<\/span><\/div><div class=\"row\"><span class=\"k\">Annexes<\/span><span>Vos sources exactes et votre consigne de base. Elles ne comptent pas dans la limite.<\/span><\/div><div class=\"row\"><span class=\"k\">Remise<\/span><span>En fin de cours, un dossier par étudiant, selon la consigne de l’enseignant.<\/span><\/div><\/div><p class=\"small\">Les rubriques vides n’apparaissent pas : vérifiez ce qui manque avant l’export.<\/p>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Le dépôt\" class=\"slide\" data-title=\"Exporter le dossier\" data-ch=\"Partie 4 · Dossier et dépôt\">\n  <div class=\"in\">\n    <h2>Contrôler et exporter le dossier<\/h2><p class=\"lead\">D’abord, vérifiez ce qui manque et complétez. Ensuite, exportez et relisez le PDF avant de le déposer.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-cc1=\"check\">Vérifier ce qui manque<\/button><button class=\"btn\" type=\"button\" data-cc1=\"pdf\">Exporter le dossier (PDF)<\/button><\/div><div class=\"msg cc1-msg\" aria-live=\"polite\"><\/div><p class=\"small\">Plus de 4 pages ? Resserrez d’abord le contexte et l’analyse. Gardez la synthèse courte.<\/p>\n  <\/div>\n<\/section>\n\n<section data-sec=\"Bilan du cours\" class=\"slide\" data-keep=\"1\" data-title=\"Partie 4 : ma progression\" data-ch=\"Partie 4 · Dossier et dépôt\">\n  <div class=\"in\">\n    <h2>Partie 4 : ma progression<\/h2><div class=\"progbox\" data-s=\"4\"><\/div><div class=\"stack\" style=\"gap:6px\"><span class=\"lab\">Mettre votre travail à l’abri<\/span><p class=\"small\">Vos réponses restent dans ce navigateur. Enregistrez maintenant votre fichier .json : il vous suit sur n’importe quel appareil, même si le navigateur est vidé.<\/p><div class=\"actions\"><button class=\"btn sec\" type=\"button\" data-save=\"1\">Enregistrer mon travail
