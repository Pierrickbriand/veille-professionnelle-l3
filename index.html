scules : l’un ou l’autre. Guillemets droits : l’expression exacte. Le signe moins : exclure un mot ou un site. Sur Google, l’espace vaut AND.<\/p>\"}, {\"t\": \"Rappel : les filtres avancés\", \"g\": \"Le cours · partie 2#2\", \"h\": \"<p>site: limite à un site ou un domaine (.gouv.fr, .org). filetype: limite à un type de fichier (pdf). intitle: cherche dans le titre. Le filtre de date garde les résultats récents.<\/p>\"}, {\"t\": \"Rappel : une source fiable\", \"g\": \"Le cours · partie 3#1\", \"h\": \"<p>Qui parle ? Quand ? Pourquoi : informer ou vendre ? Sur quoi s’appuie-t-elle ? Une deuxième source dit-elle la même chose ?<\/p>\"}, {\"t\": \"La grille : la recherche (5 points)\", \"g\": \"Le cours · partie 3#4\", \"h\": \"<p>Les requêtes booléennes intègrent correctement les opérateurs de base. Les filtres avancés sont pertinents. La méthode de recherche est retracée de façon transparente dans le dossier.<\/p>\"}, {\"t\": \"La grille : les sources (5 points)\", \"g\": \"Le cours · partie 3#4\", \"h\": \"<p>Des données récentes sur Decathlon. Des sources variées et fiables : presse économique, documents techniques, données publiques. Les contenus publicitaires ou superficiels sont écartés.<\/p>\"}], \"asm\": null, \"reflex\": false, \"intro\": null, \"id\": \"3.2\", \"bonus\": false, \"groups\": [[\"Les requêtes\", [0, 1, 2, 3, 4, 5]], [\"Source 1\", [6, 7, 8, 9]], [\"Source 2\", [10, 11, 12, 13]], [\"Source 3\", [14, 15, 16, 17]], [\"Source 4\", [18, 19, 20, 21]], [\"Source 5\", [22, 23, 24, 25]], [\"Le tri\", [26, 27]]]}, \"3.3\": {\"s\": 3, \"type\": \"ex\", \"pts\": 20, \"min\": 30, \"title\": \"Traitement avec l’IA\", \"h2\": \"Traiter ses sources avec une IA, puis corriger\", \"todo\": [\"Rédigez votre consigne : un rôle, un objectif, le matériau, un format. Copiez-la, joignez vos sources et envoyez-la à Claude.\", \"Résumez la réponse, puis vérifiez chaque chiffre dans sa source. Notez ce que vous avez corrigé.\"], \"deliv\": \"les quatre éléments de votre consigne, la consigne envoyée, le résumé de la réponse, puis vos corrections.\", \"fields\": [{\"k\": \"ia_role\", \"t\": \"text\", \"l\": \"Le rôle donné à l’IA\", \"ph\": \"Ex. Tu es analyste en veille stratégique dans le commerce du sport.\", \"rows\": 2, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"ia_obj\", \"t\": \"area\", \"l\": \"L’objectif\", \"ph\": \"Ex. Repérer ce qui peut changer la stratégie de Decathlon sur la seconde main.\", \"rows\": 2, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"ia_mat\", \"t\": \"area\", \"l\": \"Le matériau et les règles\", \"ph\": \"Ex. Utilise seulement les cinq sources jointes. N’invente rien. Pour chaque chiffre, cite la source.\", \"rows\": 2, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"ia_format\", \"t\": \"area\", \"l\": \"Le format attendu\", \"ph\": \"Ex. Un tableau : donnée clé, source, enjeu. Puis un signal faible en deux lignes.\", \"rows\": 2, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"ia_prompt\", \"t\": \"area\", \"l\": \"La consigne envoyée, telle quelle\", \"ph\": \"Collez ici la consigne complète que vous avez envoyée\", \"rows\": 4, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"ia_outil\", \"t\": \"text\", \"l\": \"L’outil, le modèle et la date\", \"ph\": \"Ex. Claude, Sonnet, 21 octobre 2026\", \"rows\": 2, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"ia_rep\", \"t\": \"area\", \"l\": \"Ce que l’IA a répondu, en cinq lignes\", \"ph\": \"Les données clés et les enjeux qu’elle propose\", \"rows\": 4, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"ia_err\", \"t\": \"area\", \"l\": \"Les erreurs ou incohérences repérées, et votre correction\", \"ph\": \"Ex. un chiffre absent de la source, une date fausse, une source inventée\", \"rows\": 3, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"ia_ctrl\", \"t\": \"checks\", \"l\": \"Contrôle de la réponse\", \"ph\": \"\", \"rows\": 2, \"o\": [\"chaque chiffre retrouvé dans sa source\", \"les sources citées par l’IA existent\", \"les ajouts hors de mes sources sont retirés\"], \"min\": 3, \"mw\": 0, \"req\": true}], \"aides\": [{\"t\": \"Rappel : une consigne structurée\", \"g\": \"Le cours · partie 2#4\", \"h\": \"<p>Un rôle, un objectif, le matériau (vos sources, rien d’autre), un format de réponse, une règle de vérification.<\/p>\"}, {\"t\": \"Rappel : l’IA, assistant d’analyse\", \"g\": \"Le cours · partie 2#3\", \"h\": \"<p>L’IA lit et structure les sources que vous lui donnez. Elle peut inventer un chiffre plausible : chaque chiffre se vérifie dans le document d’origine.<\/p>\"}, {\"t\": \"Rappel : traiter avec l’IA\", \"g\": \"Le cours · partie 3#2\", \"h\": \"<p>Joindre les sources, envoyer la consigne, relire ligne par ligne, vérifier chaque chiffre, corriger et noter ce qui a été corrigé.<\/p>\"}, {\"t\": \"La recherche web de Claude\", \"g\": \"Votre poste de travail Claude\", \"h\": \"<p>Bouton « + » en bas de la zone de saisie, puis « Recherche web » (« Web search »). Dans la nouvelle version de Claude, il n’y a pas de bouton : Claude cherche quand c’est utile. Ouvrez chaque source qu’il cite.<\/p>\"}, {\"t\": \"La grille : l’IA (5 points)\", \"g\": \"Le cours · partie 3#4\", \"h\": \"<p>La consigne de base figure en annexe. Elle donne un rôle précis et un objectif clair. Vous corrigez les incohérences produites par la machine.<\/p>\"}], \"asm\": {\"btn\": \"Copier ma consigne\", \"title\": \"Consigne de veille\", \"parts\": [[\"Rôle\", \"ia_role\"], [\"Objectif\", \"ia_obj\"], [\"Matériau et règles\", \"ia_mat\"], [\"Format attendu\", \"ia_format\"]]}, \"reflex\": false, \"intro\": null, \"id\": \"3.3\", \"bonus\": false, \"groups\": [[\"Ma consigne\", [0, 1, 2, 3]], [\"L’envoi\", [4, 5, 6]], [\"L’esprit critique\", [7, 8]]], \"html\": \"<p class=\\\"small\\\">Le bouton « Copier ma consigne » assemble les quatre éléments. Collez le texte dans Claude, ajoutez vos sources, envoyez. Recollez ensuite la consigne finale dans l’onglet « L’envoi ».<\/p><span class=\\\"msg mjmsg\\\" aria-live=\\\"polite\\\"><\/span>\"}, \"3.4\": {\"s\": 3, \"type\": \"iter\", \"pts\": 15, \"min\": 15, \"title\": \"Fil itéré · Claude analyste de veille\", \"h2\": \"Fil itéré : approfondir l’analyse avec Claude\", \"todo\": [\"Ouvrez une nouvelle conversation sur claude.ai.\", \"Envoyez les consignes une par une, dans le même fil. Notez à chaque tour ce que vous observez.\"], \"deliv\": \"vos observations sur chacun des quatre tours. Le fil, lui, se fait dans Claude.\", \"steps\": [{\"t\": \"Extraire\", \"p\": \"Tu es analyste en veille stratégique dans le commerce du sport. Voici mes sources sur Decathlon :\\n[collez vos sources]\\nPour chaque source, extrais deux données clés, avec la phrase exacte qui les contient.\", \"q\": \"Chaque phrase citée est-elle vraiment dans la source ?\"}, {\"t\": \"Enjeux\", \"p\": \"À partir de ces seules données, quels enjeux pour Decathlon ? Classe-les du plus au moins important, en une ligne chacun.\", \"q\": \"Êtes-vous d’accord avec ce classement ?\"}, {\"t\": \"Signal\", \"p\": \"Quel signal faible ces sources laissent-elles voir ? Donne ce qui le confirme et ce qui le contredit.\", \"q\": \"Le signal rejoint-il celui que vous pressentiez en 3.1 ?\"}, {\"t\": \"Limites\", \"p\": \"Relis tes réponses. Qu’as-tu affirmé sans t’appuyer sur mes sources ? Liste ces points.\", \"q\": \"Claude reconnaît-il toutes ses limites ?\"}], \"reflex\": true, \"aides\": [{\"t\": \"Pourquoi un fil itéré ?\", \"g\": \"\", \"h\": \"<p>Chaque tour s’appuie sur le précédent. Claude garde le contexte du fil : vous affinez au lieu de recommencer.<\/p>\"}, {\"t\": \"Rappel : l’IA, assistant d’analyse\", \"g\": \"Le cours · partie 2#3\", \"h\": \"<p>L’IA lit et structure les sources que vous lui donnez. Elle peut inventer un chiffre plausible : chaque chiffre se vérifie dans le document d’origine.<\/p>\"}], \"id\": \"3.4\", \"bonus\": false, \"opt\": true, \"_rtab\": true}, \"3.5\": {\"s\": 3, \"type\": \"ex\", \"pts\": 20, \"min\": 45, \"title\": \"Rédaction : le dossier\", \"h2\": \"Rédiger le dossier de veille\", \"todo\": [\"Rédigez chaque partie du dossier. Le bouton reprend vos réponses de 3.1 et 3.3 dans les parties vides.\", \"Contrôlez, puis exportez le dossier en PDF : l’outil indique le nombre de pages.\"], \"deliv\": \"la synthèse, le contexte, l’analyse, les recommandations, les limites, puis le contrôle coché.\", \"fields\": [{\"k\": \"rd_signal\", \"t\": \"area\", \"l\": \"Synthèse : le signal faible en deux phrases\", \"ph\": \"Ce qui se passe, et pourquoi Decathlon doit s’en soucier\", \"rows\": 3, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"rd_contexte\", \"t\": \"area\", \"l\": \"1. L’angle et le contexte\", \"ph\": \"La question de veille, l’axe, ce qu’on sait déjà\", \"rows\": 3, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"rd_analyse\", \"t\": \"area\", \"l\": \"3. L’analyse : les faits clés et les enjeux\", \"ph\": \"Trois à cinq faits sourcés, et ce qu’ils changent\", \"rows\": 6, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"rd_impl\", \"t\": \"area\", \"l\": \"3. Ce que Decathlon doit surveiller ou faire\", \"ph\": \"Deux ou trois pistes, et le service concerné\", \"rows\": 3, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"rd_lim\", \"t\": \"area\", \"l\": \"4. Les limites de votre veille\", \"ph\": \"Ce qui reste incertain, ce qu’il faudrait vérifier\", \"rows\": 2, \"o\": [], \"min\": 1, \"mw\": 0, \"req\": true}, {\"k\": \"rd_ctrl\", \"t\": \"checks\", \"l\": \"Contrôle avant l’export\", \"ph\": \"\", \"rows\": 2, \"o\": [\"le signal faible ressort dès la synthèse\", \"chaque chiffre a sa source\", \"la consigne de base est en annexe\", \"le corps du dossier tient en 4 pages\"], \"min\": 4, \"mw\": 0, \"req\": true}], \"aides\": [{\"t\": \"Rappel : le plan du dossier\", \"g\": \"Le cours · partie 3#3\", \"h\": \"<p>Synthèse : le signal faible. Puis   var NS=(C.seances||[]).length||4,NSt=['','d’une partie','des deux parties','des trois parties','des quatre parties','des cinq parties','des six parties','des sept parties','des huit parties','des neuf parties','des dix parties','des onze parties','des douze parties'][NS]||('des '+NS+' parties');
  var GMAX=Math.max(1,Math.min(4,C.groupe_max||4)),SOLO=GMAX===1;/* groupe_max dans cours.json : 1 pour un travail individuel */
  var h='<div class="bt-in"><p class="lab">'+eh((C.etiquette||C.titre||'L’IA dans les fonctions de l’entreprise').replace(/'/g,'’'))+'</p><h1>'+(SOLO?'Votre nom':AVEC?'Votre groupe et votre marque':'Votre groupe')+'</h1>'+
    '<p class="lead">'+(SOLO?'Le travail est individuel. Indiquez votre nom au format NOM Prénom.':AVEC?'Déclarez votre groupe, de 1 à '+GMAX+' étudiants, puis choisissez la marque fil rouge '+NSt+'.':'Déclarez votre groupe, de 1 à '+GMAX+' étudiants.')+'</p>'+
    '<fieldset class="bt-g"><legend>'+(SOLO?'Étudiant':'Membres du groupe')+'</legend>';
  for(var i=0;i<GMAX;i++)h+='<label class="vh" for="bt-m'+i+'">Membre '+(i+1)+'</label><input type="text" id="bt-m'+i+'" autocomplete="off" placeholder="'+(i?'NOM Prénom (facultatif)':'NOM Prénom')+'" value="'+eh(mem[i]||'')+'">';
  h+='</fieldset>';
  if(AVEC){h+='<fieldset class="bt-m"><legend>Marque fil rouge</legend><div class="bt-cards">';
  ORD.forEach(function(k){var B=M[k];h+='<label class="bt-card"><input type="radio" name="bt-marque" value="'+k+'"><span class="bt-n">'+eh(B.nom)+'</span><span class="bt-s">'+eh(B.m_secteur||'')+'</span><span class="bt-p">'+eh(B.m_resume||'')+'</span></label>';});
  var L=(g&&g.libre)||{};
  var SEUL=!ORD.length;/* marque libre seule : pas de liste de marques dans les réglages */
  if(C.marque_libre!==false)h+='<label class="bt-card bt-libre"><input type="radio" name="bt-marque" value="libre"'+(SEUL?' checked':'')+'><span class="bt-n">'+(SEUL?'Votre marque':'Autre marque')+'</span><span class="bt-s">'+(SEUL?'Choisie par le groupe':'Avec l’accord de votre enseignant')+'</span><span class="bt-p">Vous cherchez vous-mêmes les données. Les exemples et les quiz portent sur '+eh((M[C.exemple]||M[ORD[0]]||{}).nom||'la marque d’exemple')+'.</span></label>';
  h+='</div><div class="bt-lf" id="bt-lf"'+(SEUL?'':' hidden')+'><p class="small">Une marque grand public, présente en France, avec assez d’informations publiques.</p>'+
    [['nom','Nom de la marque','Ex. Saint James',1],['secteur','Secteur','Ex. pulls et vêtements marins',1],['produit','Produit phare, sans article','Ex. marinière en laine',1],['desc','La marque en quelques mots','Ex. marque normande de vêtements marins tricotés en France',1],['site','Site officiel (facultatif)','Ex. saint-james.com',0]].map(function(x){
      return '<label class="bt-lfl" for="bt-l-'+x[0]+'">'+x[1]+'</label><input type="text" id="bt-l-'+x[0]+'" maxlength="90" autocomplete="off" placeholder="'+x[2]+'" value="'+eh(L[x[0]]||'')+'">';}).join('')+
    '</div></fieldset><p class="small">La marque vaut pour tout le module. Pour en changer : bouton « Changer de nom (RESET) », sur l’écran « Votre groupe et votre marque ». Vos textes déjà écrits ne changeront pas.</p>';}
  h+=
    '<p class="msg" id="bt-msg" aria-live="polite"></p><div class="actions"><button class="btn" type="button" id="bt-go">Commencer</button></div></div>';
  box.innerHTML=h;box.hidden=false;
  [].forEach.call(box.querySelectorAll('input[name="bt-marque"]'),function(r){r.addEventListener('change',function(){var lf=document.getElementById('bt-lf');if(lf)lf.hidden=!(r.checked&&r.value==='libre');});});
  /* v47 : la touche Entrée dans un champ de l'écran d'ouverture vaut « Commencer » */
  box.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing&&e.target&&e.target.tagName==='INPUT'){e.preventDefault();document.getElementById('bt-go').click();}});
  document.getElementById('bt-go').addEventListener('click',function(){
    var ms=[0,1,2,3].map(function(i){var e=document.getElementById('bt-m'+i);return e?e.value.trim():'';}).filter(Boolean);
    var r=box.querySelector('input[name="bt-marque"]:checked'),msg=document.getElementById('bt-msg');
    if(!ms.length){msg.textContent='Indiquez au moins un membre du groupe.';document.getElementById('bt-m0').focus();return;}
    if(AVEC&&!r){msg.textContent='Choisissez une marque.';return;}
    var gg={membres:ms,marque:r?r.value:'',date:new Date().toISOString()};
    if(r&&r.value==='libre'){var lf={};['nom','secteur','produit','desc','site'].forEach(function(k){lf[k]=document.getElementById('bt-l-'+k).value.trim().replace(/\s+/g,' ');});
      var manque=[['nom','le nom de la marque'],['secteur','le secteur'],['produit','le produit phare'],['desc','la marque en quelques mots']].filter(function(x){return !lf[x[0]];});
      if(manque.length){msg.textContent='Pour une autre marque, indiquez '+manque.map(function(x){return x[1];}).join(', ')+'.';document.getElementById('bt-l-'+manque[0][0]).focus();return;}
      gg.libre=lf;}
    wr(gg);start(gg);
  });
})();

</script>
