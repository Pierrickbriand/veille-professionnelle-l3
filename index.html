<title>ISO L3 – Veille professionnelle</title>
<meta charset="utf-8">
<script src="https://pierrickbriand.github.io/outils-ia-pedagogie/suivi/suivi.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Mise en page : une diapositive plein écran, texte aligné à gauche sur une marge de 8 %, flux vertical (aucune position absolue pour le contenu) afin d'éviter tout chevauchement. */
:root{
  --bg:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#6F6F74; --line:#D2D2D7; --tint:#F5F5F7;
  --accent:#0047AB; --black:#000000;
  --font:'Poppins','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 clamp(17px,1.5vw,22px)/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
p{margin:0;max-width:46em}
b,strong{font-weight:700}
a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dark :focus-visible,body.dk .nav :focus-visible{outline-color:#fff}

#deck{position:relative;height:100%}
.slide{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;background:var(--bg);color:var(--ink)}
.slide.on{display:block;animation:fadein .28s ease}
.slide.dark{background:var(--black);color:#fff}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}*{transition:none!important}}

.in{min-height:100%;display:flex;flex-direction:column;gap:clamp(14px,2.8vh,30px);
  padding-top:clamp(28px,7vh,72px);padding-bottom:clamp(76px,13vh,120px);
  padding-left:max(16px,env(safe-area-inset-left,0px),8vw);padding-right:max(16px,env(safe-area-inset-right,0px),8vw)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-weight:600;font-size:clamp(26px,3.1vw,42px);line-height:1.12;letter-spacing:-.015em}
h3{font-weight:600;font-size:1em;line-height:1.3}
.sub,.muted{color:var(--ink2)}
.small{font-size:.8em;color:var(--ink3)}
.lead{font-size:1.15em}
.ac{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:clamp(12px,2vh,22px)}

/* Couverture et respirations (fond noir) */
.cover .in{display:grid;grid-template-rows:20% minmax(0,38%) 8% auto 1fr auto 10%;gap:0;padding-top:0;padding-bottom:0}
.cover h1{grid-row:2;font-weight:300;font-size:clamp(32px,5.3vw,72px);line-height:1.08;letter-spacing:-.02em;color:#fff}
.cover .sub{grid-row:4;color:var(--ink3);font-size:clamp(16px,1.9vw,26px)}
.cover .cred{grid-row:6;color:var(--ink2);font-size:clamp(13px,1.1vw,15px)}
.opener .in{padding-top:20vh}
.opener h1{font-weight:300;font-size:clamp(36px,6.2vw,88px);line-height:1.06;letter-spacing:-.025em;color:#fff;max-width:14em}
.closing .in{padding-top:20vh}
.closing h1{font-weight:300;font-size:clamp(36px,6.2vw,88px);color:#fff}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5;pointer-events:none;
  font-size:13px;color:var(--ink3);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px),8vw);padding-right:max(16px,env(safe-area-inset-right,0px),8vw)}
.nav>*{pointer-events:auto}
.nav .l,.nav .r{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.lnk{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:6px 8px;border-radius:4px}
.lnk:hover{color:var(--ink)}
body.dk .lnk:hover{color:#fff}
.nav .cnt{padding:6px 8px;font-variant-numeric:tabular-nums}

/* Sommaire */
#toc{position:fixed;inset:0;z-index:10;background:#fff;color:var(--ink);overflow-y:auto;display:none}
#toc.open{display:block}
#toc .in{gap:18px}
#toc h2{margin-bottom:4px}
#toc ol{list-style:none;margin:0;padding:0}
#toc .ch{margin-top:18px;font-size:.8em;font-weight:600;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
#toc li button{display:flex;gap:16px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0;font:inherit;color:var(--ink);cursor:pointer}
#toc li button:hover{color:var(--accent)}
#toc li .n{color:var(--ink3);min-width:2.2em;font-variant-numeric:tabular-nums}
#toc li.cur button{font-weight:600}

/* Tableaux et rangées à filets */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:600;text-align:left;border-bottom:1px solid var(--ink);padding:10px 16px 10px 0}
.tbl td{border-bottom:1px solid var(--line);padding:12px 16px 12px 0;vertical-align:top}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:8px 32px;padding:14px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row.n{grid-template-columns:2.2em minmax(0,1fr)}
.row .k{font-weight:600}
.row .num{color:var(--ink3);font-variant-numeric:tabular-nums}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr)}.row.n{grid-template-columns:2.2em minmax(0,1fr)}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px 36px}
.col{border-top:1px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col.cur{border-top:2px solid var(--accent)}
.col .no{font-size:.8em;color:var(--ink3);font-variant-numeric:tabular-nums}
.col.cur .no{color:var(--accent)}

/* Boutons et onglets */
.btn{font:500 .78em var(--font);background:#fff;color:var(--ink);border:1px solid var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.sec{border-color:var(--line);color:var(--ink2)}
.btn[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin:0 22px -1px 0;padding:10px 0;font:600 .95em var(--font);color:var(--ink2);cursor:pointer;text-align:left}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{padding-top:clamp(14px,2.4vh,24px);display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px 44px}
.two>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-size:.78em;font-weight:600;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
.quote{border-left:2px solid var(--ink);padding-left:16px}
.quote.b{border-left-color:var(--accent)}

/* Schémas */
.dwrap{overflow-x:auto;max-width:100%}
.dwrap svg{display:block;width:100%;height:auto;min-width:640px;max-height:56vh}
svg text{font-family:var(--font);fill:var(--ink)}
svg .sk{stroke:var(--ink);stroke-width:1.3;fill:none}
svg .sg{stroke:var(--ink3);stroke-width:1;fill:none}
svg .sa{stroke:var(--accent);stroke-width:2;fill:none}
svg .fa{fill:var(--accent);stroke:none}
svg .fw{fill:#fff}
svg .t1{font-size:17px;font-weight:600}
svg .t2{font-size:14.5px;fill:var(--ink2)}
svg .ta{fill:var(--accent);font-weight:600;font-size:17px}
svg .tw{fill:#fff;font-size:15px;font-weight:600}
svg .dash{stroke-dasharray:5 5}
svg .lnk2{fill:none;stroke:var(--line);stroke-width:1.4;transition:stroke .2s,stroke-width .2s}
svg .lnk2.hot{stroke:var(--accent);stroke-width:2.4}
svg .lnk2.dim{stroke:#EBEBED}
svg .nd{cursor:pointer}
svg .nd text{transition:fill .2s}
svg .nd.hot text{fill:var(--accent)}

/* Curseurs */
.slid{display:grid;grid-template-columns:minmax(5em,1fr) minmax(0,3fr) minmax(5em,1fr);gap:14px;align-items:center;padding:10px 0}
.slid .e{font-size:.85em;color:var(--ink2)}
.slid .e:last-child{text-align:right}
.trk{position:relative;height:2px;background:var(--line)}
.bnd{position:absolute;top:-6px;height:14px;background:#EBEBED;border-radius:7px}
.dot{position:absolute;top:-7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--accent);transition:left .55s cubic-bezier(.3,.7,.2,1)}

/* Étiquettes de présence */
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:.78em;padding:4px 10px;border:1px solid var(--line);border-radius:5px;color:var(--ink3)}
.tag.on{border-color:var(--accent);color:var(--accent);font-weight:600}

/* Annotation de texte */
.ann{border:0;background:none;font:inherit;color:inherit;padding:0 1px;cursor:pointer;border-bottom:2px solid var(--line)}
.ann:hover,.ann[aria-pressed=true]{border-bottom-color:var(--accent);color:var(--accent)}

/* Quiz et tri */
.opt{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 14px;font:inherit;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed=true]{border:2px solid var(--ink);padding:9px 13px}
.opt.ok{border:2px solid var(--accent)}
.opt .st{font-size:.78em;font-weight:600;color:var(--accent)}
.opt.bad .st{color:var(--ink3)}
.opt .lt{font-weight:600;color:var(--ink3)}
.fb{padding:12px 0;border-top:1px solid var(--line)}

/* Code et documents */
pre.doc{margin:0;white-space:pre-wrap;word-break:break-word;font:400 .72em/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--tint);border-radius:6px;padding:16px 18px;max-height:46vh;overflow:auto}

/* Atelier */
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 32px;flex-wrap:wrap}
.exh .kick{font-size:.8em;color:var(--ink3);margin-bottom:4px}
.exr{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.exnav{display:flex;gap:4px;flex-wrap:wrap}
.exnav button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:5px;font:500 12px var(--font);color:var(--ink2);cursor:pointer;font-variant-numeric:tabular-nums}
.exnav button.cur{border:2px solid var(--ink);color:var(--ink);font-weight:700}
.exnav button.done{border-color:var(--accent);color:var(--accent)}
.timer{display:flex;align-items:center;gap:6px;font-size:.8em}
.timer .tt{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.4em;font-size:1.15em}
.timer .tt.end{color:var(--ink3)}
.excols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:24px 48px;align-items:start}
@media (max-width:860px){.excols{grid-template-columns:minmax(0,1fr)}}
.excols .exl{display:flex;flex-direction:column;gap:12px}
.excols .exf{display:flex;flex-direction:column;gap:14px;min-width:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .lb{font-size:.82em;font-weight:600}
.fld .h{font-size:.76em;color:var(--ink3)}
input[type=text],textarea,select{font:400 16px/1.4 var(--font);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9em;padding:6px 0;border-bottom:1px solid var(--line)}
.chk input{margin-top:.35em;accent-color:var(--accent);width:16px;height:16px;flex:none}
.msg{font-size:.82em;color:var(--ink2);min-height:1.4em}
.msg.ok{color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .c{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ink);border-radius:5px;padding:3px 4px 3px 10px;font-size:.85em}
.chips .c button{background:none;border:0;cursor:pointer;color:var(--ink2);font:inherit;padding:0 6px}
.chips .c button:hover{color:var(--accent)}
.rng{display:grid;grid-template-columns:minmax(4.5em,1fr) minmax(0,3fr) minmax(4.5em,1fr);gap:10px;align-items:center;font-size:.82em;color:var(--ink2)}
.rng input{width:100%;accent-color:var(--accent)}
.rng span:last-child{text-align:right}
.seg{display:inline-flex}
.seg button{border:1px solid var(--line);background:#fff;padding:6px 14px;font:500 .85em var(--font);color:var(--ink2);cursor:pointer;margin-left:-1px}
.seg button:first-child{border-radius:5px 0 0 5px;margin-left:0}
.seg button:last-child{border-radius:0 5px 5px 0}
.seg button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:700;position:relative;z-index:1}
.evr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.evr .q{font-size:.85em;color:var(--ink2)}
.evr .q b{color:var(--ink);display:block}
.tot{font-weight:700;font-variant-numeric:tabular-nums}
.sepl{border-top:1px solid var(--line);padding-top:16px}
.mini{font-size:.82em}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prog{display:flex;align-items:center;gap:12px;font-size:.85em;color:var(--ink2)}
.prog .bar{flex:1;max-width:260px;height:2px;background:var(--line);position:relative}
.prog .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .4s}
.arrow{color:var(--ink3);padding:0 2px}
.flow{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.flow .s{border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-weight:600}
.flow .s.k{border-color:var(--accent);color:var(--accent)}
.big{font-weight:300;font-size:clamp(28px,4.4vw,60px);line-height:1.1;letter-spacing:-.02em}
.kw{display:flex;flex-wrap:wrap;gap:6px 28px}

/* Compléments */
.cover .in{height:100%}
.panel:empty{display:none}
.lines{display:flex;flex-direction:column}
.lines>p{border-top:1px solid var(--line);padding:9px 0;max-width:none}
.lines>p:last-child{border-bottom:1px solid var(--line)}
.timer .btn{padding:4px 10px}
.stack>.btn{text-align:left}
.panel .lead{max-width:36em}
.fld label.chk{font-weight:400;font-size:.9em}
.dwrap svg.sm{min-width:300px}
.in>div[id]:not(.cols){display:flex;flex-direction:column;gap:clamp(12px,2vh,22px)}
.ann{cursor:pointer;border-bottom:2px solid var(--line)}
.ann:hover,.ann[aria-pressed=true]{border-bottom-color:var(--accent);color:var(--accent)}
.nav .r{flex-wrap:nowrap}
@media (max-width:560px){#chn{display:none}.lnk{padding:6px 6px}}
.nav{background:var(--bg)}
body.dk .nav{background:var(--black)}

.qrbox{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.qr{flex:none;width:clamp(120px,11vw,168px);background:#fff;line-height:0}
.qr svg{width:100%;height:auto;display:block;min-width:0;max-height:none}
.qrbox .stack{gap:4px;min-width:0}
.qrbox a{overflow-wrap:anywhere}
.qr svg{shape-rendering:crispEdges}

/* Échelle grand écran : tout grossit avec la largeur, jusqu'aux projecteurs 4K */
body{font-size:clamp(17px,1.85vw,40px)}
h2{font-size:clamp(28px,3.6vw,76px)}
.cover h1{font-size:clamp(32px,5.3vw,120px)}
.cover .sub{font-size:clamp(16px,2.2vw,44px)}
.cover .cred{font-size:clamp(14px,1.4vw,28px)}
.opener h1,.closing h1{font-size:clamp(36px,6.2vw,150px)}
.big{font-size:clamp(28px,4.4vw,110px)}
.nav{font-size:clamp(13px,1.05vw,22px)}
.small{font-size:.88em}
.lab{font-size:.84em}
.mini{font-size:.9em}
.tag{font-size:.85em}
.btn{font-size:.85em}
.tabs button{font-size:1em}
.fld label,.fld .lb{font-size:.9em}
.fld .h{font-size:.82em}
.chk{font-size:.95em}
.msg{font-size:.9em}
.exh .kick{font-size:.88em}
.timer{font-size:.88em}
.exnav button{width:clamp(28px,2.4vw,48px);height:clamp(28px,2.4vw,48px);font-size:clamp(12px,1.05vw,22px)}
input[type=text],textarea,select{font-size:clamp(16px,1.35vw,30px)}
pre.doc{font-size:.8em}
.rng,.slid .e,.evr .q{font-size:.9em}
.opt .st{font-size:.85em}
svg .t1,svg .ta{font-size:21px}
svg .t2{font-size:17.5px}
.qr{width:clamp(120px,12vw,260px)}

/* Réglages de hauteur pour grands textes */
.dwrap svg.sm{max-height:30vh}
#tri .row,#choix .row{grid-template-columns:minmax(0,1.3fr) auto minmax(0,1.5fr);align-items:center;padding:8px 0;font-size:.88em;gap:8px 24px}
#tri .stack,#choix .stack{display:contents}
#tri .fbk,#choix .fbk{margin:0}
@media (max-width:860px){#tri .row,#choix .row{grid-template-columns:minmax(0,1fr)}}
#intro-atelier .in{gap:clamp(10px,1.8vh,20px)}
#parcours .btn{font-size:.78em;padding:6px 10px}
#parcours .stack{gap:6px}
#checkpoint .row.n{padding:8px 0}
#checkpoint pre.doc{max-height:50vh}
#prevDossier{max-height:30vh!important}

@media (min-width:900px){#parcours{grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:16px 20px}}
#choix .row{grid-template-columns:minmax(0,2.2fr) auto minmax(0,1.3fr)}
@media (max-width:860px){#choix .row{grid-template-columns:minmax(0,1fr)}}
#checkpoint .exl{font-size:.88em}

/* Schémas d'interface guidés */
.walk{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:clamp(16px,2vw,40px);align-items:start}
@media (max-width:900px){.walk{grid-template-columns:minmax(0,1fr)}}
.wf{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.wf svg{display:block;width:100%;height:auto;min-width:560px}
.wf .wfrm{fill:#fff;stroke:var(--line);stroke-width:1}
.wf .wbar{fill:var(--tint)}
.wf .wbar2{fill:#E3E3E8}
.wf .wbox{fill:#fff;stroke:var(--line);stroke-width:1.6}
.wf .wbtn{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.wf .w1{font-size:25px;font-weight:600}
.wf .w2{font-size:21px;font-weight:600;fill:var(--ink3)}
.wf .w3{font-size:19px;fill:var(--ink)}
.wf [data-show]{opacity:0;transition:opacity .45s;pointer-events:none}
.wf [data-show].v{opacity:1}
.wf .hl{fill:none;stroke:var(--accent);stroke-width:3.5;rx:8;opacity:0;transition:opacity .3s}
.wf .hl.on{opacity:1;animation:hlp 1.6s ease-in-out infinite}
@keyframes hlp{50%{stroke-width:6}}
.wf .pin .c{fill:var(--ink3);transition:fill .3s}
.wf .pin.on .c{fill:var(--accent)}
.wf .pin text{fill:#fff;font-size:17px;font-weight:700}
.wf .pin .ring{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center}
.wf .pin.on .ring{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.wf .wcur{transition:transform .9s cubic-bezier(.45,0,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.wp{display:flex;flex-direction:column;gap:12px;font-size:.9em;min-width:0}
.wp h3{margin:0}
.wp .wd{display:flex;flex-direction:column;gap:12px}
.todo{border-left:4px solid var(--accent);background:var(--tint);padding:10px 16px 12px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:4px;animation:slidein .45s ease both}

/* Opérateurs de recherche */
.ops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px}
.ops .opc{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.ops .opc p{margin:0;font-size:.85em;color:var(--ink2,#3a3a3c)}
.ops pre.doc{margin:2px 0 0;padding:6px 10px;font-size:.78em;white-space:pre-wrap;word-break:break-word}
@media (max-width:900px){.ops{grid-template-columns:1fr}}

#horsParcours,.slide-hors{display:none!important}
/* v24 : navigation des activités toujours au même endroit, sous le titre */
.exh{flex-direction:column;align-items:stretch;gap:12px}
.exh .exr{flex-direction:row;align-items:center;justify-content:space-between;width:100%;flex-wrap:wrap;gap:10px 24px}
/* v25 : nom du cours dans la barre, case « Partie non suivie » */
.nav .crs{padding:6px 0 6px 8px;font-weight:600;white-space:nowrap}
#side .srt{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink3,#6b6b6b);margin:2px 0 8px;cursor:pointer;line-height:1.35}
#side .srt input{margin-top:2px}
.nav .crs::after{content:"·";padding-left:8px;font-weight:400}
@media (max-width:820px){.nav .crs{display:none}}
/* v25 : le cours en onglets, projetable */
.cours .itabs button{font-size:.82em;padding:7px 12px}
.cours .cpan{gap:12px;max-width:62em;font-size:1.02em;line-height:1.5}
.cours .cpan p{margin:0}
.cours .cdef{border-left:3px solid var(--accent);padding:6px 0 6px 14px}
.cours .cex{background:var(--tint,#efe9dd);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.cours .cex .lab{color:var(--accent)}
.cours .cli{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.cours .ctb{overflow-x:auto}
.cours .ctb .tbl td,.cours .ctb .tbl th{padding:7px 14px 7px 0}
.cours .cq{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--card,#fff)}
.cours .cq summary{cursor:pointer;font-weight:600}
.cours .cq p{margin-top:6px}
.csrc{margin-top:-6px}
.csrc .fdl{font-weight:600;color:var(--accent2,var(--accent));white-space:nowrap}
/* v25 : fenêtre de confirmation */
.mdl{position:fixed;inset:0;z-index:200;background:rgba(30,24,18,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mdl-in{background:var(--bg);color:var(--ink);border-radius:12px;max-width:34em;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mdl-in h2{font-size:1.25em;margin:0}
/* v45 : fenêtre « Votre envoi » : défile si elle dépasse l'écran, liens alignés à gauche */
.mdl-in{max-height:calc(100vh - 32px);overflow:auto}
.mdl .ccmiss{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.mdl .ccmiss li{text-align:left}
.mdl .ccmiss .lnk{text-align:left;padding-left:0}
.mdl-in input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;letter-spacing:.08em}
.mdl-in .btn[disabled]{opacity:.45;cursor:not-allowed}
/* v28 : page « Tableau de bord » seule */
body.dashonly #deck,body.dashonly .nav,body.dashonly #side,body.dashonly #sideBd,body.dashonly #dsX{display:none!important}
body.dashonly #dash{position:static;display:block;background:var(--bg);min-height:100vh}
body.dashonly #dash .in{max-width:1400px;margin:0 auto;padding:clamp(20px,4vw,48px) max(16px,env(safe-area-inset-left,0px))}
/* v30 : carte du groupe, contrôle du CC1, retour à l'activité, état de sauvegarde, téléphone */
.grpcard{display:flex;flex-wrap:wrap;gap:12px 36px;align-items:flex-end;padding:14px 18px;background:var(--tint);border-left:3px solid var(--accent)}
.grpcard>div{display:flex;flex-direction:column;gap:2px}
.grpcard b{font-size:1.08em;color:var(--ink)}
.grpcard .btn{margin-left:auto}
.ccmiss{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.ccmiss li{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;border-bottom:1px solid var(--line);padding:3px 0}
.ccmiss .lnk{padding:0 4px;color:var(--accent)}
.nav .ret{font-weight:600;color:var(--accent)}
#bSave.due{font-weight:600}
.tblw{overflow-x:auto}
.tblw .tbl{min-width:640px}
@media (max-width:700px){
  .tblw::before{content:"Faites glisser le tableau →";display:block;font-size:.8em;color:var(--ink3);margin-bottom:4px}
  .roles .rd,.roles .rq{display:none}
  .roles .rcard{min-width:0;padding:4px 10px}
  .exh .timer{display:none}
  .in{padding-bottom:calc(4.5em + env(safe-area-inset-bottom))}
  .pgl li{flex-wrap:wrap}
  .pgl li span:last-child{white-space:normal}
  .grpcard .btn{margin-left:0}
}
/* Où j'en suis : carte de reprise, badge « Vous êtes ici » */
#where{position:fixed;z-index:30;left:50%;top:max(16px,6vh);transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--bg);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);box-shadow:0 12px 40px rgba(0,0,0,.18);padding:18px 22px;display:flex;flex-direction:column;gap:8px;font-size:clamp(14px,1vw,18px)}
#where p{margin:0}
#where .lab{color:var(--accent)}
#side li .here{display:inline-block;margin-left:6px;font-size:.72em;font-weight:600;color:var(--bg);background:var(--accent);padding:1px 6px;border-radius:999px;white-space:nowrap;vertical-align:1px}
@media (max-width:700px){#bWhere{display:none}}
.roles .rhead{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--ink3)}
@media (max-width:700px){.roles .rq2{display:none}}
/* Fil rouge du module, en tête de chaque cours */
.fil{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px;counter-reset:f}
.fil li{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:7.5em;padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;color:var(--ink2);line-height:1.25;text-align:center}
.fil li b{font-weight:600;font-size:.92em}
.fil li small{font-size:.74em;color:var(--ink3)}
.fil li.fait{background:var(--tint);border-color:var(--accent);color:var(--ink)}
.fil li.cur{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.fil li.cur small{color:var(--bg);opacity:.85}
.fil li+li::before{content:"→";position:absolute;left:-18px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:.9em}
@media (max-width:700px){.fil{gap:6px 18px}.fil li{min-width:0;padding:5px 9px}.fil li+li::before{left:-15px}}
/* Badges, niveaux et notification */
.bdgs{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.bdgs ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13em),1fr));gap:6px 10px}
.bdgs li{display:flex;gap:8px;align-items:center;color:var(--ink3);font-size:.86em;line-height:1.25}
.bdgs li.on{color:var(--ink)}
.bdgs li b{display:block;font-weight:600}
.bdgs li small{display:block;font-size:.85em;color:var(--ink3)}
.bdg{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:var(--ink3);font-size:.95em}
.bdg.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
#where .bdgs ul{grid-template-columns:repeat(auto-fill,minmax(min(100%,11em),1fr))}
#where{max-height:calc(100vh - 32px);overflow:auto}
.toast{position:fixed;z-index:40;left:50%;bottom:76px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 16px;max-width:min(460px,calc(100vw - 32px));transition:opacity .5s}
.toast b{display:block}.toast small{display:block;color:var(--ink3)}
.toast.out{opacity:0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* v48 : bouton « Guider les étudiants », dans la barre du bas (édition formateur ouverte depuis l'Atelier) */
.lnk.guide-btn{font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:16px;padding:4px 12px;margin-right:6px;white-space:nowrap}
.lnk.guide-btn.on{background:#A8425A;border-color:#A8425A;color:#fff}
.lnk.guide-btn.err{outline:3px solid #E8A33D}
@media print{.guide-btn{display:none!important}}

/* Écran de démarrage : groupe et marque */
.boot{position:fixed;inset:0;overflow:auto;background:var(--bg,#fff);color:var(--ink,#1d1d1f);z-index:50;display:flex;justify-content:center;padding:40px 16px}
.boot[hidden]{display:none}
.boot .bt-in{max-width:880px;width:100%;display:flex;flex-direction:column;gap:16px}
.boot h1{font-size:2em;margin:0}
.boot fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.boot legend{font-weight:600;margin-bottom:8px}
.boot .bt-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.boot .bt-g legend{grid-column:1/-1}
.boot input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line,#d2d2d7);border-radius:6px;background:var(--card,#fff);color:inherit}
.boot .bt-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.boot .bt-card{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line,#d2d2d7);border-radius:8px;padding:14px;cursor:pointer;position:relative;background:var(--card,#fff)}
.boot .bt-card input{position:absolute;opacity:0;pointer-events:none}
.boot .bt-card:has(input:checked){border:2px solid var(--accent,#0B57D0);padding:13px}
.boot .bt-card:has(input:focus-visible){outline:2px solid var(--accent,#0B57D0);outline-offset:2px}
.boot .bt-n{font-weight:700;font-size:1.1em}
.boot .bt-s{font-size:.85em;color:var(--accent,#0B57D0);font-weight:600}
.boot .bt-p{font-size:.9em;color:var(--ink3,#6F6F74)}
.wordmark{font-weight:800;font-size:1.6em;letter-spacing:.02em;display:inline-block;padding:10px 0}

/* v25 : option « Autre marque » */
.boot .bt-libre{border-style:dashed}
.boot .bt-lf{display:grid;grid-template-columns:1fr;gap:6px;margin-top:14px;padding:14px;border:1px solid var(--line,#d2d2d7);border-radius:8px;background:var(--card,#fff)}
.boot .bt-lf[hidden]{display:none}
.boot .bt-lfl{font-weight:600;font-size:14px;margin-top:6px}
.boot .bt-lf input{width:100%;box-sizing:border-box}

/* Charte Pierrick Briand : bleu marine, rose poudré, turquoise ; fonds gris clair et blancs. Commune à tous les cours et à l'application Suivi des cours, sans logo d'école. */
:root{
  --bg:#F3F3F6;      /* gris très clair */
  --card:#FFFFFF;    /* blanc des cartes et des champs */
  --tint:#F7E1E2;    /* rose poudré éclairci */
  --ink:#1B2740;     /* bleu nuit, texte */
  --ink2:#3F4C66;    /* bleu ardoise */
  --ink3:#56627A;    /* gris bleu, contraste AA sur fond clair */
  --line:#D8DCE6;    /* filet gris bleu */
  --accent:#1F3D66;  /* bleu marine */
  --accent2:#1D6F69; /* turquoise assombri pour le contraste */
  --kaki:#A8425A;    /* rose profond pour les étiquettes */
  --black:#1F3A5F;   /* respirations : bleu marine */
}
body{background:var(--bg)}
a{color:var(--accent2)}
.lab,.kick{color:var(--kaki)}
input,textarea,select{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn{border-color:var(--ink2)}
.slide.dark{background:var(--black);color:#FFFFFF}
.cover h1{color:#FFFFFF}
.cover .sub{color:#F3BDBE}
.cover .cred{color:#C9D3E3}
body.dk .nav{color:#C9D3E3}
body.dk .sidebtn[aria-expanded=true]{color:#8FD3CC}
svg .lnk2.dim{stroke:#E3E6EE}
.bnd{background:#E3E6EE}
.wf .wbar2{fill:#E3E6EE}
.ssec li.th.done .ic{background:#B7DCD8;border-color:#B7DCD8}
pre.doc,.doc{background:var(--tint)}
.boot{background:var(--bg)}
.boot .bt-card,.boot input[type=text]{background:var(--card)}
.boot .bt-s{color:var(--accent)}
.lnk,.sidebtn{color:var(--accent2)}
:focus-visible{outline-color:var(--accent2)}
details>summary svg,.aide summary .ic{color:var(--accent2);stroke:var(--accent2)}
#side{background:var(--card)}
/* barre de navigation lisible sur les écrans sombres */
body.dk .nav .lnk{color:#E3E9F3}
body.dk .nav .lnk:hover{color:#fff}

/* boutons principaux turquoise */
.actions .btn:not(.sec),#bt-go{background:var(--accent2);border-color:var(--accent2);color:#fff}
.actions .btn:not(.sec):hover,#bt-go:hover{background:#175a55;border-color:#175a55}

/* Couverture plus sobre : titre et sous-titre réduits d'environ un tiers (l'échelle reste progressive jusqu'aux grands écrans) */
.cover h1{font-size:clamp(26px,3.8vw,88px)}
.cover .sub{font-size:clamp(15px,1.7vw,34px)}
@media (min-width:1100px){body.side .cover h1{font-size:clamp(24px,3.1vw,46px)}}

/* Écran de démarrage (« Votre groupe et votre marque », « Votre nom ») : taille fixe, qui ne grossit plus avec la largeur de l'écran */
.boot{font-size:17px}
.boot h1{font-size:1.75em;line-height:1.15}
.boot .bt-in{max-width:820px}

/* Écrans d'ouverture (parcours, évaluation, journal) : frise, barre de notation, carnet. Classes préfixées ov- ; communes à tous les cours. */
.kick{font-size:.78em;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:-.6em}
.ov-frise{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:18px}
.ov-frise li{position:relative;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:12px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ov-frise li h3{font-size:1.02em}
.ov-frise li p{font-size:.86em;color:var(--ink2)}
.ov-pt{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9em;background:var(--bg);color:var(--ink3);border:2px solid var(--line);margin-bottom:4px}
.ov-date{font-size:.76em;color:var(--ink3);font-variant-numeric:tabular-nums}
.ov-st{align-self:flex-start;margin-top:auto;font-size:.72em;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--ink2)}
.ov-frise li.done{border-top-color:var(--accent2)}
.ov-frise li.done .ov-pt{background:var(--accent2);border-color:var(--accent2);color:#fff}
.ov-frise li.done .ov-st{background:#DDEFED;color:#155752}
.ov-frise li.skip{border-style:dashed;border-top-style:solid;background:transparent}
.ov-frise li.skip .ov-pt{border-style:dashed}
.ov-frise li.cur{border-color:var(--accent);border-top-color:var(--accent);box-shadow:0 8px 24px -12px rgba(31,61,102,.45)}
.ov-frise li.cur .ov-pt{background:var(--accent);border-color:var(--accent);color:#fff}
.ov-frise li.cur .ov-st{background:var(--accent);color:#fff}
@media (min-width:900px){.ov-frise li:not(:last-child)::after{content:"";position:absolute;top:32px;right:-19px;width:20px;height:2px;background:var(--line)}}
.ov-but{display:flex;align-items:center;gap:16px;background:var(--black);color:#fff;border-radius:12px;padding:16px 20px}
.ov-but svg{flex:none;color:#F3BDBE}
.ov-but p{max-width:none}

.ov-barre{display:flex;border-radius:12px;overflow:hidden;min-height:68px;gap:3px;background:var(--bg)}
.ov-barre span{display:flex;flex-direction:column;justify-content:center;padding:10px 14px;color:#fff;font-size:.82em;line-height:1.25;min-width:0}
.ov-barre b{font-size:1.5em;font-weight:700;font-variant-numeric:tabular-nums}
.ov-barre .c1,.ov-carte.c1 .ov-st{background:var(--accent)}
.ov-barre .c2,.ov-carte.c2 .ov-st{background:var(--accent2)}
.ov-barre .c3,.ov-carte.c3 .ov-st{background:var(--kaki)}
.ov-cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px}
.ov-carte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ov-carte p{font-size:.88em;color:var(--ink2)}
.ov-carte .ov-st{margin-top:0;color:#fff}
.ov-carte.c1{border-left:5px solid var(--accent)}
.ov-carte.c2{border-left:5px solid var(--accent2)}
.ov-carte.c3{border-left:5px solid var(--kaki)}
.ov-carte.cur{box-shadow:0 8px 24px -12px rgba(29,111,105,.5)}
.ov-grille{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.8em}
.ov-grille li{display:grid;grid-template-columns:6.2em minmax(0,1fr) auto;align-items:center;gap:10px}
.ov-grille i{display:block;height:10px;border-radius:99px;background:var(--accent2);width:calc(var(--p) / 6 * 100%)}
.ov-grille b{font-variant-numeric:tabular-nums;color:#155752}
.ov-hors{border:1px dashed var(--kaki);background:var(--tint);border-radius:12px;padding:12px 16px;font-size:.86em;color:var(--ink)}

.ov-jx{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
@media (max-width:820px){.ov-jx{grid-template-columns:minmax(0,1fr)}}
.ov-carnet{margin:0;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--kaki);border-radius:6px 12px 12px 6px;padding:16px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 28px -16px rgba(27,39,64,.35)}
.ov-carnet figcaption{font-size:.76em;font-weight:600;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
.ov-je{display:flex;flex-direction:column;gap:4px}
.ov-je p{font-size:.9em}
.ov-jt{align-self:flex-start;font-size:.7em;font-weight:600;padding:2px 9px;border-radius:99px}
.ov-jt.t1{background:#E3E9F3;color:var(--accent)}
.ov-jt.t2{background:var(--tint);color:#8A3149}
.ov-jt.t3{background:#DDEFED;color:#155752}
.ov-mode{display:flex;flex-direction:column;gap:16px}
.ov-etapes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ov-etapes li{display:flex;gap:12px;align-items:flex-start}
.ov-etapes svg{flex:none;color:var(--accent2);background:#DDEFED;border-radius:8px;padding:6px;box-sizing:content-box}
.ov-etapes div{display:flex;flex-direction:column;gap:2px;font-size:.9em}
.ov-etapes span{color:var(--ink2)}
.ov-cpt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:.9em}
.ov-dots{display:flex;gap:6px}
.ov-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent2)}
.ov-cpt[data-n="1"] .ov-dots i:nth-child(-n+1),.ov-cpt[data-n="2"] .ov-dots i:nth-child(-n+2),.ov-cpt[data-n="3"] .ov-dots i{background:var(--accent2)}
.ov-cpt[data-n="3"]{border-color:var(--accent2);background:#F0F8F7}
/* Frise par phases (cours à nombreuses parties) : statut et dates posés par le moteur (data-phase, data-sn) */
.ov-phases>li{gap:4px;padding-top:12px}
.ov-phases .ov-pt{width:28px;height:28px;margin-bottom:2px}
@media (min-width:900px){.ov-phases>li:not(:last-child)::after{top:26px}}
.ov-seances{list-style:none;margin:2px 0 4px;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.8em}
.ov-seances li{display:grid;grid-template-columns:1.8em minmax(0,1fr) auto;gap:6px;align-items:baseline;border:0;padding:2px 0;background:none;border-radius:0}
.ov-seances b{font-variant-numeric:tabular-nums;color:var(--ink3)}
.ov-seances .ov-d{font-style:normal;color:var(--ink3);font-size:.92em;white-space:nowrap}
.ov-seances li.done span{color:var(--ink3)}
.ov-seances li.done b{color:var(--accent2)}
.ov-seances li.auj{font-weight:600}
.ov-seances li.auj b{color:var(--accent)}
.ov-frise .ov-seances li::after{content:none}
.ov-dix{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
